function hexToRgb(h) { h = h.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

/* SKILL CRYSTAL: faceted gem built from an outline ring + inner table ring.
   Facet shading is computed from a light direction so every stage looks lit. */
const CR_GEOM = [
  { pts: 4, w: 22, top: 26, bot: 98, mid: 58, inner: 0 },
  { pts: 6, w: 28, top: 22, bot: 100, mid: 52, inner: .42 },
  { pts: 8, w: 30, top: 16, bot: 102, mid: 50, inner: .46 },
  { pts: 10, w: 33, top: 12, bot: 104, mid: 50, inner: .5 },
  { pts: 12, w: 35, top: 8, bot: 106, mid: 50, inner: .52 }
];
const SKINS = {
  classic: { name: 'Classic', light: .82, deep: .5, edge: '#fff', alpha: 1 },
  glass: { name: 'Glass', light: .9, deep: .25, edge: '#fff', alpha: .72 },
  obsidian: { name: 'Obsidian', light: .25, deep: .85, edge: null, alpha: 1, dark: true },
  gilded: { name: 'Gilded', light: .78, deep: .5, edge: '#FFD66B', alpha: 1, gold: true },
  holo: { name: 'Holo', light: .85, deep: .45, edge: '#fff', alpha: 1, holo: true }
};
function crystalSVG(skill, stage = 0, opts = {}) {
  const sk = SKILLS[skill] || SKILLS.memory, g = CR_GEOM[clamp(stage, 0, 4)], id = uid('cr');
  const skin = SKINS[opts.skin || S.equipped.skin] || SKINS.classic;
  const dim = opts.dim; const cx = 50, n = g.pts;
  const base = dim ? '#9A94AE' : sk.hex, tint = dim ? '#D6D2E0' : sk.tint, deep = dim ? '#5E5870' : sk.deep;
  // outline: diamond-ish silhouette (top point, widening to mid, tapering to bottom point)
  const P = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2; // start at top
    const sx = Math.cos(a), sy = Math.sin(a);
    const y = sy < 0 ? g.mid + sy * (g.mid - g.top) : g.mid + sy * (g.bot - g.mid);
    const wob = stage === 0 ? [0, 4, -3, 2][i % 4] : 0;
    P.push([cx + sx * g.w * (1 - Math.abs(sy) * .15) + wob, y]);
  }
  const C = [cx - 2, g.mid - 4];
  const Q = g.inner ? P.map(([x, y]) => [C[0] + (x - C[0]) * g.inner, C[1] + (y - C[1]) * g.inner]) : null;
  const light = -2.2; // light from upper-left
  const shade = ang => { const k = .5 + .5 * Math.cos(ang - light); return k; };
  const col = k => skin.dark ? mix('#1A1626', base, k * .55) : (k > .5 ? mix(base, '#ffffff', (k - .5) * 2 * skin.light * .75) : mix(base, deep, (.5 - k) * 2 * skin.deep * 1.4));
  let facets = '';
  for (let i = 0; i < n; i++) {
    const a = P[i], b = P[(i + 1) % n], mx = (a[0] + b[0]) / 2 - C[0], my = (a[1] + b[1]) / 2 - C[1];
    const k = shade(Math.atan2(my, mx));
    if (Q) { const qa = Q[i], qb = Q[(i + 1) % n]; facets += `<path d="M${a}L${b}L${qb}L${qa}Z" fill="${col(k)}"/>`; }
    else facets += `<path d="M${a}L${b}L${C}Z" fill="${col(k)}"/>`;
  }
  const pstr = P.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const table = Q ? `<polygon points="${Q.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="url(#${id}t)"/>` : '';
  // highlight edge along upper-left outline
  const hiPts = P.slice(Math.floor(n * .7)).concat([P[0]]);
  const edge = skin.edge || base;
  const glow = stage >= 3 && !dim ? `<circle cx="50" cy="${g.mid}" r="${stage === 4 ? 50 : 44}" fill="url(#${id}g)"/>` : '';
  const halo = stage >= 2 && !dim ? `<ellipse cx="50" cy="${g.mid}" rx="40" ry="46" fill="url(#${id}g)" opacity="${stage === 2 ? .5 : .8}"/>` : '';
  const sparkles = stage >= 3 && !dim ? [[18, 30, 5], [84, 44, 4], [76, 96, 3.4]].slice(0, stage === 4 ? 3 : 2).map(([x, y, s], i) => `<path class="cr-twinkle" style="animation-delay:${i * .7}s" d="M${x} ${y - s * 2}Q${x} ${y} ${x + s * 2} ${y}Q${x} ${y} ${x} ${y + s * 2}Q${x} ${y} ${x - s * 2} ${y}Q${x} ${y} ${x} ${y - s * 2}Z" fill="#fff"/>`).join('') : '';
  const orbit = stage === 4 && !dim ? `<g class="cr-orbit"><circle cx="50" cy="10" r="3" fill="${tint}"/><circle cx="92" cy="70" r="2.2" fill="#fff"/></g><g class="cr-orbit b"><circle cx="10" cy="80" r="2.6" fill="${tint}"/></g>` : '';
  const side = stage >= 2 ? (() => { const sx = 22, sy = g.bot - 30, s = .34; const pts = P.map(([x, y]) => [sx + (x - cx) * s, sy + (y - g.mid) * s]); return `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${col(.3)}"/><polygon points="${pts.slice(0, Math.ceil(n / 2) + 1).map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${col(.85)}" opacity=".85"/>`; })() : '';
  const holo = (skin.holo || stage === 4) && !dim ? `<polygon points="${pstr}" fill="url(#${id}h)" opacity="${skin.holo ? .55 : .35}" style="mix-blend-mode:screen"/>` : '';
  return `<svg class="crystal" viewBox="0 0 100 124" aria-hidden="true" style="width:100%;height:100%">
  <defs>
    <radialGradient id="${id}g"><stop offset="0" stop-color="${base}" stop-opacity=".55"/><stop offset=".6" stop-color="${base}" stop-opacity=".12"/><stop offset="1" stop-color="${base}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${skin.dark ? .35 : .95}"/><stop offset=".55" stop-color="${skin.dark ? base : tint}" stop-opacity="${skin.dark ? .5 : 1}"/><stop offset="1" stop-color="${base}"/></linearGradient>
    <radialGradient id="${id}s"><stop offset="0" stop-color="${deep}" stop-opacity=".45"/><stop offset="1" stop-color="${deep}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8AD8"/><stop offset=".35" stop-color="#8AF0FF"/><stop offset=".65" stop-color="#FFF08A"/><stop offset="1" stop-color="#B08AFF"/></linearGradient>
  </defs>
  ${glow}${halo}
  <ellipse cx="50" cy="${g.bot + 10}" rx="${g.w * .9}" ry="5" fill="url(#${id}s)"/>
  ${side}
  <g opacity="${skin.alpha}">${facets}${table}</g>
  ${holo}
  <polyline points="${hiPts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${edge}" stroke-opacity="${skin.dark ? .9 : .75}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="${pstr}" fill="none" stroke="${skin.gold ? '#FFC94A' : skin.dark ? base : deep}" stroke-opacity="${skin.gold || skin.dark ? .95 : .35}" stroke-width="${skin.gold ? 2 : 1}" stroke-linejoin="round"/>
  <ellipse cx="${C[0] - g.w * .35}" cy="${g.mid - (g.mid - g.top) * .45}" rx="${g.w * .16}" ry="${(g.mid - g.top) * .12 + 2}" fill="#fff" opacity="${dim ? .3 : .7}" transform="rotate(-30 ${C[0] - g.w * .35} ${g.mid - (g.mid - g.top) * .45})"/>
  ${sparkles}${orbit}
  </svg>`;
}

/* medallions for achievements / league */
const TIER_COL = { bronze: ['#E7A46B', '#A8622D'], silver: ['#E6E9F0', '#8F97A8'], gold: ['#FFE08A', '#D49100'], diamond: ['#B8F3FF', '#3BA7D6'], hidden: ['#C9C3D9', '#6E6880'] };

function seqGen(L) {
  const types = ['arith', 'geo', 'alt', 'sq', 'fib', 'inter'], top = L <= 4 ? 0 : L <= 9 ? 1 : L <= 14 ? 2 : L <= 19 ? 3 : L <= 25 ? 4 : 5;

  else if (type === 'alt') {
    len = 6; const k = RNG.int(0, 2); let x = RNG.int(2, 12); terms = [x];
    if (k === 0) { const a = RNG.int(4, 9), b = RNG.int(1, a - 1); for (let i = 1; i < len; i++) { x += i % 2 ? a : -b; terms.push(x); } rule = `+${a}, then −${b}, repeating`; }

    else { const a = RNG.int(2, 5), b = RNG.int(6, 11); for (let i = 1; i < len; i++) { x += i % 2 ? a : b; terms.push(x); } rule = `+${a}, then +${b}, repeating`; }
  }
  else if (type === 'sq') { const s = RNG.int(1, 5), c = RNG.pick([0, 0, 1, -1, 2, 3]); len = 5; terms = Array.from({ length: len }, (_, i) => (s + i) ** 2 + c); rule = `Squares: n²${c ? (c > 0 ? ' + ' + c : ' − ' + -c) : ''} (${s}², ${s + 1}², …)`; }

  const diff = Math.max(1, Math.abs((terms[1] - terms[0])));
  const opts = uniqNums(ans, () => RNG.pick([ans + 1, ans - 1, ans + diff, ans - diff, ans + 2, ans * 2, ans + Math.round(diff / 2) || ans + 3]));
  return { terms, miss, ans, rule, type, opts };
}

function dailySet(key = todayKey()) {
  const rng = makeRng('sharp-daily-' + key), picked = [], skills = new Set();
  for (const g of rng.shuffle(GAME_ORDER)) { const sk = GAMES[g].skill; if (!skills.has(sk)) { picked.push(g); skills.add(sk); } if (picked.length === 3) break; }
  return picked;
}
function ensureDaily() { const k = todayKey(); if (S.daily.day !== k) S.daily = { day: k, results: [], done: false }; }
const startLevelFor = id => Math.max(1, S.games[id].level - 2);

function applyRound(res, { silent } = {}) {
  const gs = S.games[res.id], g = GAMES[res.id], stagesBefore = {}; SKILL_ORDER.forEach(k => stagesBefore[k] = stageOf(skillLevel(k)));
  const first = gs.plays === 0;
  gs.plays++; gs.correct += res.correct; gs.total += res.total;
  if (res.avgRT) { gs.rtSum += res.avgRT * res.correct; gs.rtN += res.correct; }
  if (res.minRT && res.minRT > 180) gs.bestRT = gs.bestRT ? Math.min(gs.bestRT, res.minRT) : res.minRT;
  gs.level = res.endLevel; gs.peak = Math.max(gs.peak, res.peak); gs.lastDay = todayKey();
  if (res.id === 'echo') gs.maxN = Math.max(gs.maxN, (res.extra && res.extra.maxN) || 1);
  let pb = false;
  if (res.mode !== 'zen') { if (res.score > gs.best) { pb = !first && res.score > 0; gs.best = res.score; } gs.ghost = res.timeline.slice(0, 62); gs.ghostDay = todayKey(); }
  S.totalMs += res.ms;
  if (!S.gamesPlayed.includes(res.id)) S.gamesPlayed.push(res.id);
  let unlocked = null; if (!S.unlocked.includes(res.id)) { S.unlocked.push(res.id); unlocked = res.id; }
  S.records.ansStreak = Math.max(S.records.ansStreak, res.maxStreak); S.records.comboMax = Math.max(S.records.comboMax, res.maxCombo);
  if (res.minRT > 180) S.records.fastRT = S.records.fastRT ? Math.min(S.records.fastRT, res.minRT) : res.minRT;
  Game.trainSkill(g.skill); if (g.skill2) Game.trainSkill(g.skill2);
  // XP
  const today = todayKey(); if (S.practice.day !== today) S.practice = { day: today, n: 0 };
  let mult = 1; if (res.mode === 'practice' || res.mode === 'weak') { S.practice.n++; if (S.practice.n > 3) mult = .3; }
  if (res.mode === 'zen') mult = .5; if (res.mode === 'baseline') mult = .6;
  const xpAns = Math.round((res.correct * 2) * mult), xpCombo = Math.round(Math.floor(res.maxStreak / 3) * 3 * mult), xpPB = pb ? 25 : 0, xpPerfect = res.perfect ? 20 : 0;
  const xp = Game.addXP(xpAns + xpCombo + xpPB + xpPerfect);
  Game.event('round', res);
  Game.checkAch({ round: res });
  // crystal evolution moments
  const evo = [];
  SKILL_ORDER.forEach(k => { const after = stageOf(skillLevel(k)); if (after > stagesBefore[k]) evo.push([k, stagesBefore[k], after]); });
  if (!silent) evo.forEach(([k, a, b]) => Moments.push(() => evolveMoment(k, a, b)));
  save();
  return { xp, xpAns, xpCombo, xpPB, xpPerfect, pb, unlocked, evo, reduced: mult < 1 && (res.mode === 'practice' || res.mode === 'weak') };
}

function finishDaily(results, { silent } = {}) {

/* insights: three personalised, honest observations */
function makeInsights(results) {
  const out = [];
  const best = results.slice().sort((a, b) => b.sharp - a.sharp)[0];
  if (best) out.push([GAMES[best.id].skill, 'i-star', `${GAMES[best.id].name} was your strongest today: ${best.sharp} Sharpness${best.extra && best.extra.maxN > 1 ? `, reaching ${best.extra.maxN}-back` : ''}.`]);
  const climb = results.slice().sort((a, b) => (b.peak - b.startLevel) - (a.peak - a.startLevel))[0];
  if (climb && climb.peak - climb.startLevel >= 2) out.push([GAMES[climb.id].skill, 'i-up', `${GAMES[climb.id].name} climbed ${climb.peak - climb.startLevel} levels this round. It now adapts to a harder start.`]);
  for (const r of results) {
    const gs = S.games[r.id];
    if (out.length >= 3) break;
    if (gs.rtN > r.correct + 5 && r.avgRT) { const hist = (gs.rtSum - r.avgRT * r.correct) / (gs.rtN - r.correct); const d = (hist - r.avgRT) / hist; if (d > .06) { out.push([GAMES[r.id].skill, 'i-bolt', `You answered ${Math.round(d * 100)}% faster in ${GAMES[r.id].name} than your average.`]); continue; } }
    if (r.acc >= .9 && r.total >= 6) out.push([GAMES[r.id].skill, 'i-target', `${Math.round(r.acc * 100)}% accuracy in ${GAMES[r.id].name}. Hard but doable is the sweet spot.`]);
  }
  const weak = SKILL_ORDER.slice().sort((a, b) => skillLevel(a) - skillLevel(b))[0];
  if (out.length < 3) out.push([weak, 'i-practice', `${SKILLS[weak].name} is your quietest skill. "Focus on weakness" in Practice trains it.`]);
  if (out.length < 3) out.push(['memory', 'i-brain', GAMES[results[0].id].fact]);
  return out.slice(0, 3);
}
function weeklySummary() {
  const h = S.history.slice(-8); if (h.length < 2) return null;
  const a = h[0].skills || {}, b = h[h.length - 1].skills || {};
  const imp = SKILL_ORDER.map(k => [k, (b[k] || 1) - (a[k] || 1)]).sort((x, y) => y[1] - x[1])[0];
  const weak = SKILL_ORDER.slice().sort((x, y) => (b[x] || 1) - (b[y] || 1))[0];
  const avg = Math.round(h.slice(1).reduce((s, x) => s + x.sharp, 0) / Math.max(1, h.length - 1));
  return { imp, weak, avg };
}

const Sheet = {
  stack: [],
  open(html, { onClose, mount, acc = '' } = {}) {
    const wrap = h(`<div class="sheet-wrap" role="dialog" aria-modal="true"><div class="sheet-bg"></div><div class="sheet ${acc}"><div class="grab-zone"><div class="grab"></div></div>${html}</div></div>`);
    $('#app').appendChild(wrap);
    const sheet = $('.sheet', wrap); const entry = { wrap, onClose }; this.stack.push(entry);
    requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
    $('.sheet-bg', wrap).addEventListener('click', () => this.close());
    // swipe down to dismiss
    let y0 = null, dy = 0;
    sheet.addEventListener('pointerdown', e => { if (sheet.scrollTop > 0 || e.target.closest('button,input,textarea,select,.slider,a')) return; y0 = e.clientY; dy = 0; });
    sheet.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); if (dy > 6) { sheet.classList.add('dragging'); sheet.style.setProperty('--drag', dy + 'px'); } });
    const up = () => { if (y0 == null) return; y0 = null; sheet.classList.remove('dragging'); if (dy > 90) this.close(); else sheet.style.setProperty('--drag', '0px'); };
    sheet.addEventListener('pointerup', up); sheet.addEventListener('pointercancel', up);
    if (mount) mount(sheet);
    setTimeout(() => { const f = $('button:not(.grab-zone button)', sheet); if (f && !isCoarse()) f.focus({ preventScroll: true }); }, 320);
    return sheet;
  },
  close() {
    const e = this.stack.pop(); if (!e) return;
    e.wrap.classList.remove('open'); setTimeout(() => e.wrap.remove(), 320);
    if (e.onClose) e.onClose();
  },
  closeAll() { while (this.stack.length) this.close(); }
};

/* shared-element expansion: a tapped card grows into the next screen */
function expandFrom(el, color) {
  return new Promise(res => {
    if (!el || RM()) return res();
    const app = $('#app'), ar = app.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = h(`<div class="expander"></div>`); x.style.background = color || 'var(--surface)';
    Object.assign(x.style, { left: (r.left - ar.left) + 'px', top: (r.top - ar.top) + 'px', width: r.width + 'px', height: r.height + 'px' });
    app.appendChild(x);
    const sx = ar.width / r.width, sy = ar.height / r.height;
    const a = x.animate([{ transform: 'none', borderRadius: '20px', opacity: 1 }, { transform: `translate(${-(r.left - ar.left)}px,${-(r.top - ar.top)}px) scale(${sx},${sy})`, borderRadius: '0px', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    a.onfinish = () => { res(); x.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' }).onfinish = () => x.remove(); };
  });
}

/* =====================================================================
   SESSION FLOW: pre-game → countdown → game → between → results
   ===================================================================== */
const Flow = {
  active: false,
  async run({ mode, games, duration = 60000 }) {
    if (this.active) return; this.active = true;
    Game.sessAch = []; const xpStart = S.xp, results = [], apps = [];
    ensureDaily(); Game.ensureQuests();
    if (mode === 'daily') S.daily.results.forEach(r => results.push(r));
    for (let i = 0; i < games.length; i++) {
      const idx = mode === 'daily' ? results.length : i, n = mode === 'daily' ? 3 : games.length;
      const res = await this.playOne(games[i], mode, idx, n, duration);
      if (!res) { this.active = false; UI.go(S.onboarded ? "home" : "onboarding"); Moments.flush(); return; }
      const app = applyRound(res); results.push(res); apps.push(app);
      if (mode === 'daily') { const slim = Object.assign({}, res); delete slim.timeline; S.daily.results.push(slim); save(true); }
      if (app.unlocked && mode !== 'baseline') setTimeout(() => toast(`${GAMES[app.unlocked].name} unlocked`, { sub: 'Now available in Practice', iconHtml: ico(GAMES[app.unlocked].icon), acc: 'sk-' + GAMES[app.unlocked].skill }), 400);
      if (i < games.length - 1 || mode === 'baseline') await this.between(res, games[i + 1]);
    }
    this.active = false;
    if (mode === 'baseline') { S.onboarded = true; save(true); UI.go('reveal'); return; }
    let daily = null;
    if (mode === 'daily') daily = finishDaily(results);
    UI.go('results', { mode, results, apps, daily, xpStart, xpEnd: S.xp, ach: Game.sessAch.slice(), insights: makeInsights(results) });
  },
  playOne(id, mode, idx, n, duration) {
    return new Promise(resolve => {
      const g = GAMES[id], seen = S.seen.includes(id), stage = UI.go('stage');
      const pg = h(`<div class="pregame sk-${g.skill}">
        <span class="tag"><span class="dot"></span>${SKILLS[g.skill].name}${n > 1 ? ` · Game ${idx + 1} of ${n}` : ''}${mode === 'zen' ? ' · Zen' : mode === 'baseline' ? ' · Baseline (30s)' : ''}</span>
        <div class="pg-cr">${crystalSVG(g.skill, stageOf(skillLevel(g.skill)))}</div>
        <h1 class="display">${esc(g.name)}</h1>
        <p class="pg-desc">${esc(g.desc)}</p>
        ${seen ? '' : `<div class="demo">${g.demo()}</div><p class="small muted" style="max-width:330px">${esc(g.rule)}</p>`}
        <button class="btn primary" style="min-width:200px;margin-top:8px" data-go>${seen ? 'Start' : 'Got it, start'}</button>
        ${seen ? `<p class="xs muted" data-auto>Starting automatically…</p>` : ''}
        <button class="btn ghost sm" data-back>${ico('i-arrow-l', 'sm')} Back</button>
      </div>`);
      stage.appendChild(pg);
      let started = false;
      const go = () => { if (started) return; started = true; Sound.unlock(); if (!S.seen.includes(id)) { S.seen.push(id); save(); } this.countdown(stage, g).then(() => launch()); };
      $('[data-go]', pg).addEventListener('click', go);
      $('[data-back]', pg).addEventListener('click', () => { started = true; resolve(null); });
      if (seen) setTimeout(() => { if (UI.cur === stage) go(); }, 1700);
      const launch = () => {
        const crEl = $('.pg-cr', pg), from = crEl.getBoundingClientRect();
        pg.remove();
        const run = new GameRun(id, { mode, duration: mode === 'zen' ? 1e9 : duration, startLevel: mode === 'baseline' ? 1 : startLevelFor(id), onEnd: res => resolve(res), onQuit: () => resolve(null) });
        Host.cur = run; run.mount(stage);
        // crystal flies into the header
        const to = $('.gt-cr', run.el).getBoundingClientRect(), ar = $('#app').getBoundingClientRect();
        if (!RM() && from.width) {
          const fly = h(`<div style="position:absolute;z-index:75;left:${from.left - ar.left}px;top:${from.top - ar.top}px;width:${from.width}px;height:${from.height}px;pointer-events:none">${crEl.innerHTML}</div>`);
          $('#app').appendChild(fly); const tgt = $('.gt-cr', run.el); tgt.style.opacity = 0;
          fly.animate([{ transform: 'none' }, { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(${to.width / from.width})` }], { duration: 420, easing: 'cubic-bezier(.34,1.3,.64,1)', fill: 'forwards' }).onfinish = () => { fly.remove(); tgt.style.opacity = 1; };
        }
        run.begin();
      };
    });
  },
  countdown(stage, g) {
    return new Promise(res => {
      const pg = $('.pregame', stage); if (pg) pg.style.opacity = .25;
      const cd = h(`<div class="countdown sk-${g.skill}"></div>`); stage.appendChild(cd);
      const steps = [3, 2, 1]; let i = 0;
      const tick = () => { if (i >= steps.length) { cd.remove(); if (pg) pg.style.opacity = 1; Sound.count(0); return res(); } cd.innerHTML = `<span class="num">${steps[i]}</span>`; Sound.count(1); buzz(8); i++; setTimeout(tick, RM() ? 450 : 650); };
      tick();
    });
  },
  between(res, nextId) {
    return new Promise(resolve => {
      const g = GAMES[res.id], stage = UI.cur;
      const extra = res.id === 'echo' ? `reached ${res.extra.maxN}-back` : `reached level ${res.peak}`;
      const line = res.acc >= .8 ? RNG.pick(ENCOURAGE) : RNG.pick(SOFT_MISS.concat(ENCOURAGE.slice(0, 6)));
      const card = h(`<div class="between-card sk-${g.skill}"><div class="bc">
        <div style="width:64px;height:76px;margin:0 auto">${crystalSVG(g.skill, stageOf(skillLevel(g.skill)))}</div>
        <div class="label" style="margin-top:6px">${esc(g.name)}</div>
        <span class="num">${res.mode === 'zen' ? res.correct + ' correct' : fmt(res.score)}</span>
        <div class="small" style="font-weight:600">${esc(extra)} · ${Math.round(res.acc * 100)}% accuracy</div>
        <p class="small muted" style="margin-top:10px">${esc(line)}</p>
        <p class="xs muted" style="margin-top:8px">${ico('i-brain', 'sm')} ${esc(g.fact)}</p>
        ${nextId ? `<p class="xs" style="margin-top:12px;font-weight:600">Next: ${esc(GAMES[nextId].name)}</p>` : ''}
      </div></div>`);
      stage.innerHTML = ''; stage.appendChild(card); Sound.chord();
      let done = false; const fin = () => { if (done) return; done = true; resolve(); };
      card.addEventListener('click', fin); setTimeout(fin, 2400);
    });
  },
  daily() {
    ensureDaily();
    if (S.daily.done) return this.run({ mode: 'practice', games: dailySet() });
    const rest = dailySet().slice(S.daily.results.length);
    return this.run({ mode: 'daily', games: rest });
  },
  weak() {
    const pool = S.unlocked.slice().sort((a, b) => skillLevel(GAMES[a].skill) - skillLevel(GAMES[b].skill) || S.games[a].level - S.games[b].level);
    const pick = [], sk = new Set(); for (const g of pool) { if (!sk.has(GAMES[g].skill)) { pick.push(g); sk.add(GAMES[g].skill); } if (pick.length === 3) break; }
    return this.run({ mode: 'weak', games: pick });
  }
};

function openChest(idx) {
  const rar = S.chests[idx]; if (!rar) return;
  const m = h(`<div class="moment sk-${rar === 'epic' ? 'memory' : rar === 'rare' ? 'logic' : 'math'}" role="dialog" aria-modal="true"><div class="m-card"><div class="m-rays" style="opacity:0;transition:opacity .4s" data-rays></div>

    <div data-out></div><button class="btn primary block" data-tap>Tap to open</button></div></div>`);
  $('#app').appendChild(m);
  const cs = $('[data-cs]', m), btn = $('[data-tap]', m); let stage = 0;
  const open = () => {
    if (stage === 0) {
      stage = 1; btn.disabled = true; Sound.unlock(); cs.classList.add('shake'); buzz([20, 30, 20, 30, 20]);
      Sound.tone(300, .08, { type: 'square', vol: .05 }); setTimeout(() => Sound.tone(340, .08, { type: 'square', vol: .05 }), 200);
      setTimeout(() => { cs.classList.add('crack'); Sound.tone(900, .05, { type: 'square', vol: .05 }); }, RM() ? 100 : 900);
      setTimeout(() => {
        cs.classList.remove('shake'); cs.classList.add('open'); $('[data-rays]', m).style.opacity = 1; Sound.pop(); buzz(50);
        const r = cs.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height * .45, '#FFD66B', 26, 6); FX.confetti(rar === 'epic' ? 40 : 18);
        S.chests.splice(idx, 1); const out = Game.roll(rar);

        btn.disabled = false; btn.textContent = S.chests.length ? `Next chest (${S.chests.length})` : 'Collect'; stage = 2;
        UI.setTab(UI.name || 'home');
      }, RM() ? 300 : 1500);
    } else if (stage === 2) {
      m.classList.add('out'); setTimeout(() => { m.remove(); if (S.chests.length && btn.textContent.startsWith('Next')) openChest(0); else if (TABS.some(t => t[0] === UI.name)) UI.go(UI.name); }, 250);
    }
  };
  btn.addEventListener('click', open); cs.addEventListener('click', () => stage === 0 && open());
}

    <div class="onb-viewport"><div class="onb-track">${slides.map(([ill, t, p]) => `<div class="onb-slide">${ill}<h1 class="display">${t}</h1><p>${p}</p></div>`).join('')}</div></div>
    <div class="onb-dots">${slides.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
    <button class="btn primary block sk-memory" style="min-height:60px" data-next>Next ${ico('i-arrow-r')}</button>
    <p class="xs muted center" style="margin-top:8px;min-height:20px" data-note></p>
  </div></div>`);
  const track = $('.onb-track', el), dots = $$('.onb-dots i', el), nb = $('[data-next]', el), note = $('[data-note]', el);
  let idx = 0;
  const set = i => { idx = clamp(i, 0, slides.length - 1); track.style.transform = `translateX(${-idx * 100}%)`; dots.forEach((d, k) => d.classList.toggle('on', k === idx)); nb.innerHTML = idx === slides.length - 1 ? `Take the 90-second baseline ${ico('i-arrow-r')}` : `Next ${ico('i-arrow-r')}`; note.textContent = idx === slides.length - 1 ? '3 games × 30 seconds to set your starting levels' : ''; };
  const startBaseline = () => { Sound.unlock(); S.onboarded = false; Flow.run({ mode: 'baseline', games: ['echo', 'rule', 'estimate'], duration: 30000 }); };
  nb.addEventListener('click', () => idx < slides.length - 1 ? set(idx + 1) : startBaseline());
  $('[data-skip]', el).addEventListener('click', () => set(slides.length - 1));
  // swipe
  let x0 = null, dx = 0; const vp = $('.onb-viewport', el);
  vp.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; track.style.transition = 'none'; });

  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end); vp.addEventListener('pointerleave', end);
  return el;
};

  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v, cy + Math.sin(ang(i)) * R * v];

  const lv = SKILL_ORDER.map(k => skillLevel(k)), any = SKILL_ORDER.some(skillPlayed);
  const data = SKILL_ORDER.map((k, i) => pt(i, Math.max(.12, lv[i] / 30)));

    ${[1 / 3, 2 / 3, 1].map(v => `<polygon points="${ring(v)}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`).join('')}
    ${SKILL_ORDER.map((_, i) => { const [x, y] = pt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('')}
    <text x="${cx + 4}" y="${cy - R / 3 + 4}" font-size="11" fill="var(--faint)">10</text><text x="${cx + 4}" y="${cy - 2 * R / 3 + 4}" font-size="11" fill="var(--faint)">20</text>
    <polygon points="${data.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="rgba(124,92,255,.16)" stroke="#7C5CFF" stroke-width="2" stroke-linejoin="round" ${any ? '' : 'stroke-dasharray="4 4"'}/>
    ${data.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="5" fill="${SKILLS[SKILL_ORDER[i]].hex}" stroke="var(--surface)" stroke-width="2"/><circle class="hit" data-i="${i}" cx="${x}" cy="${y}" r="18" fill="transparent"><title>${SKILLS[SKILL_ORDER[i]].name}: level ${lv[i]}</title></circle>`).join('')}
    ${SKILL_ORDER.map((k, i) => { const [x, y] = pt(i, 1.2), anc = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end'; return `<text x="${x}" y="${y + 4}" text-anchor="${anc}" font-size="13" font-weight="600" fill="var(--ink)">${SKILLS[k].name} <tspan fill="var(--muted)" font-weight="500">${lv[i]}</tspan></text>`; }).join('')}
  </svg>${any ? '' : '<p class="xs muted center">Finish a workout to shape your profile</p>'}<div class="chart-tip"></div>`;
}
function wireRadar(card) {
  if (!card) return; const tip = $('.chart-tip', card);
  $$('.hit', card).forEach(c => {
    const show = () => { const i = +c.dataset.i, k = SKILL_ORDER[i], r = c.getBoundingClientRect(), cr = card.getBoundingClientRect(); tip.textContent = `${SKILLS[k].name} · Lv ${skillLevel(k)} · ${STAGES[stageOf(skillLevel(k))]}`; tip.style.left = (r.left - cr.left + r.width / 2) + 'px'; tip.style.top = (r.top - cr.top + 8) + 'px'; tip.style.opacity = 1; };
    c.addEventListener('pointerenter', show); c.addEventListener('pointerdown', show); c.addEventListener('pointerleave', () => tip.style.opacity = 0);

}
function lineGeom(pts) {
  const W = 320, H = 170, L = 34, Rr = 14, T = 16, B = 24, end = dayNum(todayKey()), start = end - 29;
  const vals = pts.map(p => p.sharp), lo = Math.max(0, Math.floor((Math.min(...vals) - 60) / 100) * 100), hi = Math.min(1000, Math.ceil((Math.max(...vals) + 60) / 100) * 100);
  const x = d => L + (dayNum(d) - start) / 29 * (W - L - Rr), y = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  return { W, H, L, Rr, T, B, lo, hi, x, y, start, end };
}
function lineSVG(pts) {
  const g = lineGeom(pts), P = pts.map(p => [g.x(p.day), g.y(p.sharp)]);
  const path = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const area = path + `L${P[P.length - 1][0].toFixed(1)} ${g.H - g.B}L${P[0][0].toFixed(1)} ${g.H - g.B}Z`;
  const ticks = [g.lo, Math.round((g.lo + g.hi) / 2 / 50) * 50, g.hi];
  const bi = pts.reduce((b, p, i) => p.sharp > pts[b].sharp ? i : b, 0), li = pts.length - 1;
  const lbl = (i, txt, up) => `<text x="${P[i][0]}" y="${P[i][1] + (up ? -10 : 18)}" text-anchor="${P[i][0] > g.W - 40 ? 'end' : 'middle'}" font-size="12" font-weight="700" fill="var(--ink)">${txt}</text>`;
  const fmtD = n => new Date(n * 864e5).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  return `<svg viewBox="0 0 ${g.W} ${g.H}" role="img" aria-label="Sharpness over the last 30 days, latest ${pts[li].sharp}, best ${pts[bi].sharp}">
    <defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".22"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${g.L}" x2="${g.W - g.Rr}" y1="${g.y(t)}" y2="${g.y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${g.L - 6}" y="${g.y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    <text x="${g.L}" y="${g.H - 6}" font-size="11" fill="var(--muted)">${fmtD(g.start)}</text><text x="${g.W - g.Rr}" y="${g.H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">Today</text>
    <path d="${area}" fill="url(#lgA)"/><path d="${path}" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="4" fill="#7C5CFF" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${bi !== li ? lbl(bi, 'Best ' + pts[bi].sharp, true) : ''}${lbl(li, pts[li].sharp, bi === li || pts[li].sharp >= pts[Math.max(0, li - 1)].sharp)}
    <line class="xh" x1="0" x2="0" y1="${g.T}" y2="${g.H - g.B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle class="xd" r="6" fill="#7C5CFF" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect class="hitarea" x="${g.L}" y="0" width="${g.W - g.L}" height="${g.H}" fill="transparent"/>
  </svg><div class="chart-tip"></div>`;
}
function wireLine(card, pts) {
  if (!card || pts.length < 3) return;
  const svg = $('svg', card), tip = $('.chart-tip', card), xh = $('.xh', card), xd = $('.xd', card), g = lineGeom(pts);
  const move = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * g.W;
    let best = 0; pts.forEach((p, i) => { if (Math.abs(g.x(p.day) - sx) < Math.abs(g.x(pts[best].day) - sx)) best = i; });
    const p = pts[best], x = g.x(p.day), y = g.y(p.sharp);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('opacity', .6); xd.setAttribute('cx', x); xd.setAttribute('cy', y); xd.setAttribute('opacity', 1);
    const cr = card.getBoundingClientRect(); tip.textContent = `${new Date(dayNum(p.day) * 864e5).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' })} · ${p.sharp}`;
    tip.style.left = (r.left - cr.left + x / g.W * r.width) + 'px'; tip.style.top = (r.top - cr.top + y / g.H * r.height - 6) + 'px'; tip.style.opacity = 1;
  };
  const hide = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); xd.setAttribute('opacity', 0); };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', hide);
}

/* =====================================================================
   DEBUG PANEL (Shift+D, or tap the logo 5×)
   ===================================================================== */
function simDaily() {
  ensureDaily(); Game.ensureQuests(); if (S.daily.done) return;
  const results = dailySet().map(id => {
    const start = startLevelFor(id), peak = clamp(start + RNG.int(1, 5), 1, 30), end = clamp(peak - RNG.int(0, 2), 1, 30), exp = GAMES[id].expect;
    const correct = Math.max(1, Math.round(exp * RNG.range(.7, 1.3))), total = Math.max(correct, Math.round(correct / RNG.range(.72, .95))), score = Math.round(correct * (10 + 2 * peak) * 1.6);
    const res = { id, mode: 'daily', score, correct, total, acc: correct / total, peak, endLevel: end, startLevel: start, maxStreak: RNG.int(3, 12), maxCombo: 2, avgRT: RNG.range(700, 1600), minRT: RNG.range(380, 620), ms: 60000, timeline: Array.from({ length: 61 }, (_, i) => Math.round(score * i / 60)), levelUps: peak - start, extra: id === 'echo' ? { maxN: GAMES.echo.getChallenge(peak).n } : {}, fast: 2 };
    res.sharp = sharpFor(res, 60000); applyRound(res, { silent: Moments.mute }); return res;
  });
  S.daily.results = results.map(r => { const s = Object.assign({}, r); delete s.timeline; return s; });
  return finishDaily(results);
}
const Debug = {
  timeScale: 1,
  open() {

      <div class="dbg-grid">
        <button class="btn sm" data-d="-1">− 1 day</button><button class="btn sm" data-d="1">+ 1 day</button>
        <button class="btn sm" data-d="0">Reset date</button><button class="btn sm" data-x="xp">+500 XP</button>
        <button class="btn sm" data-x="common">Common chest</button><button class="btn sm" data-x="rare">Rare chest</button>
        <button class="btn sm" data-x="epic">Epic chest</button><button class="btn sm" data-x="skills">Skills +5</button>
        <button class="btn sm" data-x="unlock">Unlock all</button><button class="btn sm" data-x="today">Simulate today</button>
        <button class="btn sm primary sk-memory" data-x="sim14" style="grid-column:1/-1">Simulate 14 days (skips day 9)</button>
        <button class="btn sm" data-x="evo">Test evolution</button><button class="btn sm" data-x="onb">Replay onboarding</button>
      </div>
      <div class="label" style="margin-top:16px">Game speed (testing)</div>

      {
        mount: sh => {
          $$('[data-d]', sh).forEach(b => b.onclick = () => { const v = +b.dataset.d; Clock.offset = v === 0 ? 0 : Clock.offset + v; this.afterDate(); Sheet.close(); this.open(); });
          $$('[data-ts]', sh).forEach(b => b.onclick = () => { this.timeScale = +b.dataset.ts; Sheet.close(); this.open(); });

            const x = b.dataset.x;

let deferredInstall = null;
function applyTheme() {
  let t = S.settings.theme; if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'paper';
  if (!THEMES[t]) t = 'paper';
  document.documentElement.dataset.theme = t;
  $('#meta-theme').setAttribute('content', THEMES[t].bg);
  $('#app').style.setProperty('--pat', (PATTERNS[S.equipped.pattern] || PATTERNS.none).css);
}
function setupPWA() {

  $('#favicon').href = icon;
  try {
    const img = new Image(); img.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = 180; c.getContext('2d').drawImage(img, 0, 0, 180, 180); const png = c.toDataURL('image/png'); $('#touch-icon').href = png; } catch (e) { } }; img.src = icon;
  } catch (e) { }
  const start = location.href.split('#')[0];

  // offline: optional tiny service worker next to index.html (fails silently on file:// or if absent)

}
addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); Debug.open(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, run = Host.cur;
  if (run) {
    if (k === 'p') { e.preventDefault(); if (run.paused) Sheet.close(); else run.pause(true); return; }
    if (k === 'Escape') { e.preventDefault(); if (run.paused) { run.quitting = true; Sheet.closeAll(); run.quit(); } else run.pause(true); return; }
    if (Sheet.stack.length || run.paused) return;

  }
  const pgo = $('.pregame [data-go]');
  if (pgo && !Sheet.stack.length && (k === 'Enter' || k === ' ')) { e.preventDefault(); pgo.click(); return; }

    const back = $('.pregame [data-back]'); if (back) { back.click(); return; }

  }

addEventListener('pointerdown', () => Sound.unlock(), { capture: true, passive: true });

  else { if (Sound.ctx) Sound.ctx.resume().catch(() => { }); if (!Flow.active && S.onboarded && S.daily.day !== todayKey()) { Game.checkStreakOnOpen(); ensureDaily(); Game.ensureQuests(); Game.league(); if (UI.name === 'home') UI.go('home'); } }
