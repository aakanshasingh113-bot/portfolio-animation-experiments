<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- "user-scalable=no" stops phones from zooming in while you play -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patang</title>
  <style>
    /* Remove the default white border and scrollbars */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      /* Stop phones from scrolling, zooming or selecting text while you play */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: system-ui, sans-serif;
    }

    /* The game is drawn inside this box, which fills the whole window */
    #game {
      width: 100%;
      height: 100%;
    }

    /* The small buttons in the top-right corner */
    #buttons {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    #buttons button {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border: none;
      border-radius: 18px;
      background: rgba(43, 45, 66, 0.7);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    #buttons button.on {
      background: #f28c28;
    }

    /* "PAUSED" / "SLOW MOTION" label at the top */
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #2b2d42;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* Put the tuning panel just below the buttons */
    .lil-gui.root {
      position: fixed;
      top: 56px;
      right: 10px;
      z-index: 10;
      max-height: calc(100% - 66px);
      overflow-y: auto;
    }
  </style>
  <!-- Phaser: the game toolkit, loaded from the internet (a "CDN") -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- lil-gui: makes the tuning panel with sliders -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="buttons">
    <button id="slowButton" title="Slow motion (S)">Slow-mo</button>
    <button id="gearButton" title="Tuning panel (T)">⚙</button>
  </div>
  <div id="status"></div>

  <script>
    // =====================================================================
    //  SETTINGS - change these numbers to tweak the game
    // =====================================================================
    const SETTINGS = {
      // ----- Wind -----
      windStrength: 250,           // how fast the wind blows at the top of the sky (bigger = stronger wind)
      windAtRoof: 0.12,            // how much wind there is at rooftop level, compared to the top (0.12 = 12%)
      windHeightGain: 1.0,         // how much stronger the wind gets as you go higher (0 = same everywhere)
      windChangeSpeed: 0.05,       // how quickly the wind slowly changes its strength and direction
      windStrengthVariation: 0.3,  // how much the wind's strength wanders up and down (0.3 = 30% either way)
      windDirectionVariation: 12,  // how far (in degrees) the wind's direction wanders away from straight left-to-right

      // ----- Gusts (short bursts of extra wind) -----
      gustStrength: 0.8,           // how much extra wind a gust adds (0.8 = 80% stronger at its peak)
      gustEvery: 5,                // roughly how many seconds between gusts (smaller = more often)
      gustShortest: 1,             // shortest gust, in seconds
      gustLongest: 2,              // longest gust, in seconds

      // ----- Kite physics (the same for both kites) -----
      gravity: 150,                // how strongly the kites are pulled down
      kiteWeight: 1,               // how heavy a kite is (heavier = slower to react, harder to lift)
      kiteDrag: 1.5,               // how strongly the wind carries a loose kite along with it
      looseLift: 0.4,              // how much the wind holds up a loose kite, so it sinks slowly instead of dropping
      pulledDrag: 0.3,             // how much the wind still carries a pulled (tight) kite (0.3 = 30%)
      kiteGrip: 3,                 // how quickly a pulled kite follows its nose (bigger = snappier)
      kiteWobble: 0.1,             // how much the kites bob and flutter on their own (0 = perfectly steady)

      // ----- String -----
      startStringLength: 0.6,      // how much string is out at the start (1 = enough to reach the other rooftop)
      shortestString: 0.25,        // the least string you can reel in to (1 = enough to reach the other rooftop)
      longestString: 1.0,          // the most string you can let out (1 = enough to reach the other rooftop)

      // ----- Controls -----
      pullStrength: 350,           // how fast the kite darts where its nose points while you pull (in normal wind)
      reelInSpeed: 0.15,           // how fast the string is reeled in while you pull
      releaseSpeed: 0.25,          // how fast the string is let out when you let go
      steeringSensitivity: 180,    // how fast the nose turns when you steer, in degrees per second
      steeringSlide: 60,           // how far (in pixels) you slide your finger/mouse for full-speed steering
      noseSettleSpeed: 1.5,        // when you let go, how quickly the nose drifts back to pointing up-and-away

      // ----- Tension -----
      tensionBuildUp: 0.25,        // how fast tension rises while you pull (it rises faster in strong wind and up high)
      tensionDrop: 0.4,            // how fast tension falls when you let go
      redZone: 0.8,                // where the red part of the meter starts (0.8 = top 20%)
      yellowZone: 0.5,             // where the yellow part of the meter starts
      snapTime: 1.5,               // how many seconds tension can stay in the red before the string snaps

      // ----- Cutting -----
      cutSensitivity: 4,           // how quickly a faster-sliding string cuts through the other (bigger = quicker cuts)
      cutClearlyFaster: 1.3,       // how much faster one string must slide to count as "clearly faster" (1.3 = 30% faster)
      tensionCutBonus: 0.3,        // how much a tight string helps when cutting (0.3 = up to 30% stronger at full tension)

      // ----- Opponent -----
      opponentAggressiveness: 0.5, // how bold the opponent is: 0 = cautious, 1 = chases your string and pulls a lot
      opponentHeight: 0.5,         // the height the opponent likes to fly at (0 = rooftops, 1 = very high)

      // ----- Testing tools -----
      slowMotionSpeed: 0.3,        // how fast the game runs in slow motion (0.3 = 30% speed)

      // ----- Looks -----
      skyTopColor: "#7fb8e6",      // sky colour at the top of the screen
      skyBottomColor: "#fde7c8",   // sky colour at the bottom of the screen (a warm festival haze)
      rooftopColor: "#2b2d42",     // colour of both rooftops
      rooftopWidth: 0.2,           // rooftop width, as a fraction of the screen width
      rooftopHeight: 0.12,         // rooftop height, as a fraction of the screen height
      playerKiteColor: "#f28c28",  // colour of your kite (warm orange)
      opponentKiteColor: "#3a7bd5",// colour of the opponent's kite (blue)
      kiteSize: 40,                // how tall the kites are, in pixels
      tailLength: 6,               // how many little pieces a kite's tail is made of
      stringColor: "#333333",      // colour of the strings
      stringWidth: 1,              // thickness of the strings
      stringSag: 1,                // how much a slack string droops (0 = always straight)
      windLineCount: 40,           // how many wind lines drift across the sky
      windLineLength: 30,          // length of a wind line in normal wind
      windLineOpacity: 0.5,        // how see-through the wind lines are (0 = invisible, 1 = solid)
    };

    // =====================================================================
    //  GAME CODE - you shouldn't need to change anything below here
    // =====================================================================

    // Paint the sky as a soft gradient behind the game
    document.body.style.background =
      `linear-gradient(${SETTINGS.skyTopColor}, ${SETTINGS.skyBottomColor})`;

    // Turns a colour like "#f28c28" into the number format Phaser wants
    function color(hex) {
      return Phaser.Display.Color.HexStringToColor(hex).color;
    }

    // Small maths helpers
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    // The shortest way to turn from one angle to another (so the nose never spins the long way round)
    function angleDifference(from, to) { return Phaser.Math.Angle.Wrap(to - from); }

    // Everything about the screen layout (recalculated when the window changes size)
    const layout = {};

    // The wind's current state
    const wind = {
      time: 0,          // seconds since the game started
      gustTimeLeft: 0,  // seconds left in the current gust (0 = no gust)
      gustDuration: 1,  // how long the current gust lasts in total
      nextGust: 3,      // seconds until the next gust starts
      gustPower: 0,     // 0 = calm, 1 = peak of a gust
    };

    // A kite and everything about it. Both kites are made the same way.
    function makeKite(side, kiteColor) {
      return {
        side,                 // "player" or "opponent"
        color: kiteColor,
        x: 0, y: 0,           // position
        vx: 0, vy: 0,         // speed
        angle: -Math.PI / 2,  // which way the nose points
        tail: [],             // the pieces of the tail
        stringOut: 0,         // how much string is let out right now
        tension: 0,           // 0 = no tension, 1 = meter full
        timeInRed: 0,         // how long tension has been in the red
        free: false,          // has the string snapped or been cut?
        spin: 0,              // how fast it spins while tumbling away
        cutDamage: 0,         // how close this string is to being cut through (1 = cut)
        looseStrings: [],     // broken bits of string after a cut
      };
    }

    const player = makeKite("player", SETTINGS.playerKiteColor);
    const opponent = makeKite("opponent", SETTINGS.opponentKiteColor);
    const kites = [player, opponent];

    // What the player is doing right now
    const controls = {
      pointerDown: false,   // mouse button or finger held down
      pointerStartX: 0,     // where the press started (sliding away from here steers)
      pointerX: 0,
      spaceDown: false,
      leftDown: false,
      rightDown: false,
    };

    // The opponent's simple "brain"
    const brain = {
      pulling: false,       // is it pulling right now?
      switchIn: 1,          // seconds until it decides again whether to pull or let go
      targetX: 0,           // where it's trying to fly to
      targetY: 0,
    };

    // Where the strings cross (if they do)
    const crossing = {
      now: null,            // the crossing point this frame, or null
      before: null,         // the crossing point last frame
      sparkPower: 0,        // how big the spark is (bigger while sawing)
      burst: 0,             // a big flash right after a cut
      burstX: 0, burstY: 0,
    };

    // Game-wide state
    const game = {
      paused: false,
      slowMotion: false,
      over: false,
      endedAt: 0,           // when the round ended (so a tap still held from playing doesn't restart instantly)
    };

    // The faint lines that show the wind
    const windLines = [];

    // Work out sizes and positions from the current window size
    function updateLayout(width, height) {
      layout.width = width;
      layout.height = height;

      // A "reference size" so the game feels the same on phones and big screens
      layout.size = Math.min(height, width * 1.4);
      layout.scale = layout.size / 800;

      const roofW = clamp(width * SETTINGS.rooftopWidth, 70, 260);
      const roofH = clamp(height * SETTINGS.rooftopHeight, 50, 140);
      layout.roofTop = height - roofH;
      layout.playerRoof = { x: 0, y: height - roofH, w: roofW, h: roofH };
      layout.opponentRoof = { x: width - roofW, y: height - roofH, w: roofW, h: roofH };

      // The points on each rooftop where the strings are held
      player.anchorX = roofW * 0.6;
      opponent.anchorX = width - roofW * 0.6;
      player.anchorY = opponent.anchorY = height - roofH;

      // How long strings can be: enough to reach the other rooftop, even on a wide screen
      layout.reach = Math.max(layout.size, opponent.anchorX - player.anchorX);

      // The tension meter, on the left edge above your rooftop
      layout.meter = { x: 10, y: height * 0.15, w: 14, h: Math.max(60, layout.roofTop - 20 - height * 0.15) };
    }

    // ----- Wind -----

    // How strong the wind is right now overall (slowly wandering, plus gusts)
    function windStrengthNow() {
      const t = wind.time * SETTINGS.windChangeSpeed * Math.PI * 2;
      const wander = 0.6 * Math.sin(t) + 0.4 * Math.sin(t * 2.3 + 1);
      const gust = 1 + SETTINGS.gustStrength * wind.gustPower;
      return (1 + SETTINGS.windStrengthVariation * wander) * gust;
    }

    // Which way the wind blows right now (an angle; 0 = straight left-to-right)
    function windAngleNow() {
      const t = wind.time * SETTINGS.windChangeSpeed * Math.PI * 2;
      const wander = 0.7 * Math.sin(t * 0.8 + 2) + 0.3 * Math.sin(t * 1.9);
      return (SETTINGS.windDirectionVariation * wander) * Math.PI / 180;
    }

    // How high something is: 0 = rooftop level, 1 = high up
    function heightAt(y) {
      return clamp((layout.roofTop - y) / layout.size, 0, 1);
    }

    // The wind at a given height on screen, as a speed sideways (x) and up/down (y)
    function windAt(y) {
      const heightFactor = SETTINGS.windAtRoof +
        (1 - SETTINGS.windAtRoof) * clamp(heightAt(y) * SETTINGS.windHeightGain, 0, 1);
      const speed = SETTINGS.windStrength * layout.scale * windStrengthNow() * heightFactor;
      const angle = windAngleNow();
      return { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed };
    }

    // Move the wind forward in time: slow changes happen by themselves, gusts come and go
    function updateWind(dt) {
      wind.time += dt;

      if (wind.gustTimeLeft > 0) {
        wind.gustTimeLeft -= dt;
        // A gust rises smoothly, peaks in the middle, then fades
        const progress = 1 - wind.gustTimeLeft / wind.gustDuration;
        wind.gustPower = Math.max(0, Math.sin(Math.PI * progress));
      } else {
        wind.gustPower = 0;
        wind.nextGust -= dt;
        if (wind.nextGust <= 0) {
          wind.gustDuration = randomBetween(SETTINGS.gustShortest, SETTINGS.gustLongest);
          wind.gustTimeLeft = wind.gustDuration;
          wind.nextGust = SETTINGS.gustEvery * randomBetween(0.5, 1.5);
        }
      }
    }

    // ----- The kites -----

    // Put a kite in the sky at the start (or on restart)
    function launchKite(k, startAngleDegrees) {
      k.stringOut = SETTINGS.startStringLength * layout.reach;
      const startAngle = startAngleDegrees * Math.PI / 180;
      k.x = k.anchorX + Math.cos(startAngle) * k.stringOut;
      k.y = k.anchorY + Math.sin(startAngle) * k.stringOut;
      k.vx = 0;
      k.vy = 0;
      k.angle = -Math.PI / 2;
      k.tension = 0;
      k.timeInRed = 0;
      k.free = false;
      k.spin = 0;
      k.cutDamage = 0;
      k.looseStrings = [];
      k.tail = [];
      for (let i = 0; i < SETTINGS.tailLength; i++) {
        k.tail.push({ x: k.x, y: k.y + i * 6 });
      }
    }

    // Read the player's controls: are we pulling, and which way are we steering (-1 = left, 1 = right)?
    function readControls() {
      const pulling = controls.pointerDown || controls.spaceDown;
      let steer = 0;
      if (controls.leftDown) steer -= 1;
      if (controls.rightDown) steer += 1;
      if (controls.pointerDown) {
        steer += (controls.pointerX - controls.pointerStartX) / SETTINGS.steeringSlide;
      }
      return { pulling, steer: clamp(steer, -1, 1) };
    }

    // Move a kite: wind pushes and lifts it, gravity pulls it down, the string holds it
    function updateKite(k, dt, input) {
      if (k.free) {
        updateTumblingKite(k, dt);
        return;
      }

      const w = windAt(k.y);
      const normalWind = SETTINGS.windStrength * layout.scale || 1;
      const windFactor = Math.hypot(w.x, w.y) / normalWind; // about 1 in normal wind high up

      // A little flutter so the kite never sits perfectly still
      const flutter = SETTINGS.kiteWobble;
      const wobbleTime = wind.time + (k.side === "opponent" ? 7 : 0); // so the two kites don't wobble in step
      w.x *= 1 + flutter * Math.sin(wobbleTime * 3.1);
      w.y += flutter * normalWind * 0.3 * Math.sin(wobbleTime * 4.7 + 1);

      // STEER: turn the nose
      k.angle += input.steer * SETTINGS.steeringSensitivity * Math.PI / 180 * dt;

      const dx = k.x - k.anchorX;
      const dy = k.y - k.anchorY;

      // When you let go, the nose slowly drifts back to pointing up-and-away, like a loose kite
      if (!input.pulling) {
        const awayAngle = Math.atan2(dy, dx);
        const target = (awayAngle + -Math.PI / 2) / 2 + flutter * 0.5 * Math.sin(wobbleTime * 2.3);
        k.angle += angleDifference(k.angle, target) * Math.min(1, dt * SETTINGS.noseSettleSpeed);
      }

      // PULL reels the string in, RELEASE lets it out
      const stringBefore = k.stringOut;
      if (input.pulling) {
        k.stringOut -= SETTINGS.reelInSpeed * layout.reach * dt;
      } else {
        k.stringOut += SETTINGS.releaseSpeed * layout.reach * dt;
      }
      k.stringOut = clamp(k.stringOut,
        SETTINGS.shortestString * layout.reach, SETTINGS.longestString * layout.reach);
      k.reelSpeed = (k.stringOut - stringBefore) / dt; // how fast string is going out (+) or in (-)

      // Heavier kites react more slowly
      const weight = Math.max(0.1, SETTINGS.kiteWeight);
      let accelX, accelY;

      if (input.pulling) {
        // PULLED: a tight kite slices through the air and darts where its nose points,
        // faster in good wind. The wind only carries it a little.
        const dartSpeed = SETTINGS.pullStrength * layout.scale * clamp(0.4 + 0.6 * windFactor, 0.3, 1.6);
        const wantedX = Math.cos(k.angle) * dartSpeed + w.x * SETTINGS.pulledDrag;
        const wantedY = Math.sin(k.angle) * dartSpeed + w.y * SETTINGS.pulledDrag;
        accelX = (wantedX - k.vx) * SETTINGS.kiteGrip;
        accelY = (wantedY - k.vy) * SETTINGS.kiteGrip;
      } else {
        // LOOSE: the wind carries the kite downwind and holds it up a little, so it slowly sinks
        accelX = SETTINGS.kiteDrag * (w.x - k.vx);
        accelY = SETTINGS.kiteDrag * (w.y - k.vy) - SETTINGS.looseLift * Math.hypot(w.x, w.y);
      }

      // Gravity pulls down
      k.vx += (accelX / weight) * dt;
      k.vy += (accelY / weight + SETTINGS.gravity * layout.scale) * dt;

      k.x += k.vx * dt;
      k.y += k.vy * dt;

      // The string: the kite can't go further from the rooftop than the string that's out
      const ddx = k.x - k.anchorX;
      const ddy = k.y - k.anchorY;
      const distance = Math.hypot(ddx, ddy);
      if (distance > k.stringOut) {
        const nx = ddx / distance, ny = ddy / distance;
        k.x = k.anchorX + nx * k.stringOut;
        k.y = k.anchorY + ny * k.stringOut;
        // Stop any movement that would stretch the string
        const outward = k.vx * nx + k.vy * ny;
        if (outward > 0) {
          k.vx -= outward * nx;
          k.vy -= outward * ny;
        }
      }

      // The kite stays on screen and can't sink below the rooftops
      const half = SETTINGS.kiteSize / 2;
      if (k.x < half) { k.x = half; k.vx = Math.max(0, k.vx); }
      if (k.x > layout.width - half) { k.x = layout.width - half; k.vx = Math.min(0, k.vx); }
      if (k.y < half) { k.y = half; k.vy = Math.max(0, k.vy); }
      if (k.y > layout.roofTop - half) {
        k.y = layout.roofTop - half;
        k.vy = Math.min(0, k.vy);
        k.vx *= 0.9;
      }

      updateTension(k, dt, input.pulling, windFactor);
      updateTail(k, dt);
    }

    // Tension rises while pulling (faster in strong wind and up high) and falls when you let go
    function updateTension(k, dt, pulling, windFactor) {
      if (pulling) {
        const height = heightAt(k.y);
        k.tension += SETTINGS.tensionBuildUp * (0.5 + windFactor) * (0.5 + height) * dt;
      } else {
        k.tension -= SETTINGS.tensionDrop * dt;
      }
      k.tension = clamp(k.tension, 0, 1);

      // Too long in the red and the string snaps
      if (k.tension >= SETTINGS.redZone) {
        k.timeInRed += dt;
        if (k.timeInRed > SETTINGS.snapTime) snapString(k);
      } else {
        k.timeInRed = 0;
      }
    }

    // Set a kite free: it spins and tumbles away
    function setFree(k) {
      k.free = true;
      k.spin = randomBetween(4, 8) * (Math.random() < 0.5 ? -1 : 1);
    }

    // The string snaps from too much tension
    function snapString(k) {
      setFree(k);
      if (k === player) endRound("Your string snapped");
      else endRound("Their string snapped!");
    }

    // A free kite spins, drifts with the wind and falls
    function updateTumblingKite(k, dt) {
      const w = windAt(k.y);
      k.vx += SETTINGS.kiteDrag * (w.x - k.vx) * dt;
      k.vy += (SETTINGS.kiteDrag * (w.y - k.vy) * 0.3 + SETTINGS.gravity * layout.scale) * dt;
      k.x += k.vx * dt;
      k.y += k.vy * dt;
      k.angle += k.spin * dt;
      k.tension = Math.max(0, k.tension - SETTINGS.tensionDrop * 2 * dt);
      updateTail(k, dt);
    }

    // A chain of points (a tail, or a broken bit of string) that follows a leader point,
    // drifting with the wind and drooping
    function updateChain(points, leaderX, leaderY, pieceLength, droop, dt) {
      for (const piece of points) {
        const w = windAt(piece.y);
        piece.x += w.x * dt * 0.5;
        piece.y += (w.y * 0.5 + droop * layout.scale) * dt;
        const dx = piece.x - leaderX, dy = piece.y - leaderY;
        const d = Math.hypot(dx, dy) || 1;
        piece.x = leaderX + (dx / d) * pieceLength;
        piece.y = leaderY + (dy / d) * pieceLength;
        leaderX = piece.x;
        leaderY = piece.y;
      }
    }

    // The tail follows the bottom of the kite
    function updateTail(k, dt) {
      const tailStartDistance = SETTINGS.kiteSize * 0.6;
      updateChain(k.tail,
        k.x - Math.cos(k.angle) * tailStartDistance,
        k.y - Math.sin(k.angle) * tailStartDistance,
        SETTINGS.kiteSize * 0.18, 40, dt);
    }

    // ----- Strings: shape, crossing and cutting -----

    // The points along a string, from the rooftop to the kite:
    // straight when tight, drooping in a curve when slack
    function stringPoints(k) {
      const fromX = k.anchorX, fromY = k.anchorY, toX = k.x, toY = k.y;
      const distance = Math.hypot(toX - fromX, toY - fromY);
      const slack = Math.sqrt(Math.max(0, k.stringOut * k.stringOut - distance * distance));
      const sag = slack * 0.5 * SETTINGS.stringSag;
      const controlX = (fromX + toX) / 2;
      const controlY = (fromY + toY) / 2 + sag;

      const points = [];
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        points.push({
          x: (1 - t) * (1 - t) * fromX + 2 * (1 - t) * t * controlX + t * t * toX,
          y: (1 - t) * (1 - t) * fromY + 2 * (1 - t) * t * controlY + t * t * toY,
        });
      }
      return points;
    }

    // Where two straight pieces of string cross, if they do (returns how far along each one, 0 to 1)
    function segmentsCross(a1, a2, b1, b2) {
      const rX = a2.x - a1.x, rY = a2.y - a1.y;
      const sX = b2.x - b1.x, sY = b2.y - b1.y;
      const denominator = rX * sY - rY * sX;
      if (denominator === 0) return null;
      const qX = b1.x - a1.x, qY = b1.y - a1.y;
      const t = (qX * sY - qY * sX) / denominator;
      const u = (qX * rY - qY * rX) / denominator;
      if (t < 0 || t > 1 || u < 0 || u > 1) return null;
      return { t, u };
    }

    // Find where the two strings cross. For each string we also measure how far the crossing is
    // from its kite, along the string. If that distance changes, the string is sliding across the other.
    function findCrossing(pointsA, pointsB) {
      for (let i = 0; i < pointsA.length - 1; i++) {
        for (let j = 0; j < pointsB.length - 1; j++) {
          const hit = segmentsCross(pointsA[i], pointsA[i + 1], pointsB[j], pointsB[j + 1]);
          if (hit) {
            return {
              x: pointsA[i].x + (pointsA[i + 1].x - pointsA[i].x) * hit.t,
              y: pointsA[i].y + (pointsA[i + 1].y - pointsA[i].y) * hit.t,
              fromKiteA: lengthFromKite(pointsA, i, hit.t),
              fromKiteB: lengthFromKite(pointsB, j, hit.u),
              indexA: i, indexB: j,
            };
          }
        }
      }
      return null;
    }

    // Length of string between a point (piece i, fraction t of the way along it) and the kite end
    function lengthFromKite(points, i, t) {
      const segment = (n) => Math.hypot(points[n + 1].x - points[n].x, points[n + 1].y - points[n].y);
      let length = segment(i) * (1 - t);
      for (let n = i + 1; n < points.length - 1; n++) length += segment(n);
      return length;
    }

    // Every frame: do the strings cross? If so, which one is sawing through the other?
    function updateCrossing(dt) {
      crossing.before = crossing.now;
      crossing.now = null;
      if (player.free || opponent.free) return;

      const playerPoints = stringPoints(player);
      const opponentPoints = stringPoints(opponent);
      const hit = findCrossing(playerPoints, opponentPoints);
      crossing.now = hit;

      if (!hit) {
        // Not touching: any half-made cuts slowly heal
        for (const k of kites) k.cutDamage = Math.max(0, k.cutDamage - 0.5 * dt);
        crossing.sparkPower = 0;
        return;
      }
      if (!crossing.before) return; // only just touched: wait a frame so we can measure sliding

      // How fast each string is sliding across the crossing point
      const playerSlide = Math.abs(hit.fromKiteA - crossing.before.fromKiteA) / dt;
      const opponentSlide = Math.abs(hit.fromKiteB - crossing.before.fromKiteB) / dt;

      // A tighter string cuts slightly better
      const playerCut = playerSlide * (1 + SETTINGS.tensionCutBonus * player.tension);
      const opponentCut = opponentSlide * (1 + SETTINGS.tensionCutBonus * opponent.tension);

      crossing.sparkPower = clamp(Math.max(playerSlide, opponentSlide) / (0.3 * layout.size), 0.2, 1);

      // The clearly faster string damages the other one
      const cutRate = SETTINGS.cutSensitivity / layout.size;
      if (playerCut > opponentCut * SETTINGS.cutClearlyFaster) {
        opponent.cutDamage += (playerCut - opponentCut) * cutRate * dt;
      } else if (opponentCut > playerCut * SETTINGS.cutClearlyFaster) {
        player.cutDamage += (opponentCut - playerCut) * cutRate * dt;
      }

      if (opponent.cutDamage >= 1) cutString(opponent, opponentPoints, hit.indexB, hit);
      else if (player.cutDamage >= 1) cutString(player, playerPoints, hit.indexA, hit);
    }

    // A string is cut at the crossing point: the kite tumbles away trailing the broken bit,
    // and the rest of the string drops from the rooftop
    function cutString(k, points, index, hit) {
      // The bit still tied to the kite: from the kite back to the cut
      const kitePiece = points.slice(index + 1).reverse().map((p) => ({ x: p.x, y: p.y }));
      kitePiece.push({ x: hit.x, y: hit.y });
      // The bit still tied to the rooftop: from the rooftop up to the cut
      const roofPiece = points.slice(1, index + 1).map((p) => ({ x: p.x, y: p.y }));
      roofPiece.push({ x: hit.x, y: hit.y });

      k.looseStrings = [
        { points: kitePiece.slice(1), followsKite: true, pieceLength: pieceLengthOf(kitePiece) },
        { points: roofPiece, followsKite: false, pieceLength: pieceLengthOf([{ x: k.anchorX, y: k.anchorY }, ...roofPiece]) },
      ];

      setFree(k);
      crossing.burst = 1;
      crossing.burstX = hit.x;
      crossing.burstY = hit.y;
      if (k === opponent) endRound("Kai po che! You cut it!");
      else endRound("You've been cut!");
    }

    function pieceLengthOf(points) {
      let total = 0;
      for (let i = 0; i < points.length - 1; i++) {
        total += Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
      }
      return total / Math.max(1, points.length - 1);
    }

    // Broken bits of string drift and fall: one trails the kite, one hangs from the rooftop
    function updateLooseStrings(k, dt) {
      for (const loose of k.looseStrings) {
        const leaderX = loose.followsKite ? k.x : k.anchorX;
        const leaderY = loose.followsKite ? k.y : k.anchorY;
        updateChain(loose.points, leaderX, leaderY, loose.pieceLength, 150, dt);
      }
    }

    // ----- The opponent's brain -----

    // Simple rules: stay at a medium height, slowly drift towards the player's string,
    // and switch between pulling and letting go every 1-3 seconds. Let go before tension gets dangerous.
    function opponentThinks(dt) {
      if (opponent.free) return { pulling: false, steer: 0 };
      const boldness = clamp(SETTINGS.opponentAggressiveness, 0, 1);

      // Where to aim: a spot on the player's string at the opponent's favourite height
      const favouriteY = Math.max(layout.height * 0.12, layout.roofTop - SETTINGS.opponentHeight * layout.size);
      let aimX = layout.width * 0.6;
      if (!player.free) {
        const points = stringPoints(player);
        let closest = points[0];
        for (const p of points) if (Math.abs(p.y - favouriteY) < Math.abs(closest.y - favouriteY)) closest = p;
        // Aim a little past the string (upwind of it), so the two strings hook together
        aimX = closest.x - layout.size * (0.08 + 0.12 * boldness);
      }
      // Drift the target towards that spot slowly (faster when bolder)
      brain.targetX += (aimX - brain.targetX) * Math.min(1, dt * (0.1 + 0.5 * boldness));
      brain.targetY = favouriteY;

      // Every 1-3 seconds, decide again: pull or let go?
      // Letting go makes the kite drift downwind (right), so it pulls to work its way back.
      brain.switchIn -= dt;
      if (brain.switchIn <= 0) {
        brain.switchIn = randomBetween(1, 3);
        const driftedAway = opponent.x > brain.targetX + layout.size * 0.05;
        const tooLow = opponent.y > brain.targetY + layout.size * 0.1;
        const chance = (driftedAway || tooLow) ? 0.85 : 0.3 + 0.4 * boldness;
        brain.pulling = Math.random() < chance;
      }

      // Let go before the string gets close to snapping (bolder = cuts it finer)
      const safeTension = SETTINGS.yellowZone + (SETTINGS.redZone - SETTINGS.yellowZone) * boldness;
      if (opponent.tension >= safeTension) {
        brain.pulling = false;
        brain.switchIn = Math.max(brain.switchIn, 0.6);
      }

      // Steer the nose towards the target, leaning slightly upwards to keep height
      const toX = brain.targetX - opponent.x;
      const toY = brain.targetY - opponent.y;
      const length = Math.hypot(toX, toY) || 1;
      const wanted = Math.atan2(toY / length - 0.2, toX / length);
      const steer = clamp(angleDifference(opponent.angle, wanted) * 2, -1, 1);

      return { pulling: brain.pulling, steer };
    }

    // ----- Wind lines -----

    // Create the wind lines, scattered across the sky
    function createWindLines() {
      windLines.length = 0;
      for (let i = 0; i < SETTINGS.windLineCount; i++) {
        windLines.push({
          x: Math.random() * layout.width,
          y: Math.random() * layout.roofTop,
        });
      }
    }

    // Move each wind line at the speed of the wind at its height
    function updateWindLines(dt) {
      const margin = SETTINGS.windLineLength * 4;
      for (const line of windLines) {
        const w = windAt(line.y);
        line.x += w.x * dt;
        line.y += w.y * dt;
        // When a line leaves the screen, bring it back in on the other side
        if (line.x > layout.width + margin) { line.x = -margin; line.y = Math.random() * layout.roofTop; }
        if (line.x < -margin) { line.x = layout.width + margin; line.y = Math.random() * layout.roofTop; }
        if (line.y < 0) line.y += layout.roofTop;
        if (line.y > layout.roofTop) line.y -= layout.roofTop;
      }
    }

    // ----- Drawing -----

    function drawWindLines(g) {
      g.lineStyle(1, 0xffffff, SETTINGS.windLineOpacity);
      const normalSpeed = SETTINGS.windStrength * layout.scale || 1;
      for (const line of windLines) {
        const w = windAt(line.y);
        const speed = Math.hypot(w.x, w.y) || 1;
        // Faster wind = longer streak
        const length = SETTINGS.windLineLength * (0.3 + speed / normalSpeed);
        g.beginPath();
        g.moveTo(line.x, line.y);
        g.lineTo(line.x - (w.x / speed) * length, line.y - (w.y / speed) * length);
        g.strokePath();
      }
    }

    function drawRooftops(g) {
      g.fillStyle(color(SETTINGS.rooftopColor), 1);
      for (const roof of [layout.playerRoof, layout.opponentRoof]) {
        g.fillRect(roof.x, roof.y, roof.w, roof.h);
      }
    }

    // Draw a line through a list of points
    function drawLine(g, points, startX, startY) {
      g.lineStyle(SETTINGS.stringWidth, color(SETTINGS.stringColor), 1);
      g.beginPath();
      g.moveTo(startX, startY);
      for (const p of points) g.lineTo(p.x, p.y);
      g.strokePath();
    }

    // A kite's string: whole while it's flying, broken bits after a cut
    function drawString(g, k) {
      if (!k.free) {
        const points = stringPoints(k);
        drawLine(g, points.slice(1), points[0].x, points[0].y);
      }
      for (const loose of k.looseStrings) {
        const startX = loose.followsKite ? k.x : k.anchorX;
        const startY = loose.followsKite ? k.y : k.anchorY;
        drawLine(g, loose.points, startX, startY);
      }
    }

    // The kite: a diamond pointing where its nose points, with a tail
    function drawKite(g, k) {
      const size = SETTINGS.kiteSize;
      const ax = Math.cos(k.angle), ay = Math.sin(k.angle); // towards the nose
      const sx = -ay, sy = ax;                              // sideways
      const nose = { x: k.x + ax * size * 0.4, y: k.y + ay * size * 0.4 };
      const bottom = { x: k.x - ax * size * 0.6, y: k.y - ay * size * 0.6 };
      const left = { x: k.x + sx * size * 0.35, y: k.y + sy * size * 0.35 };
      const right = { x: k.x - sx * size * 0.35, y: k.y - sy * size * 0.35 };

      // Tail
      g.lineStyle(2, color(k.color), 0.8);
      g.beginPath();
      g.moveTo(bottom.x, bottom.y);
      for (const piece of k.tail) g.lineTo(piece.x, piece.y);
      g.strokePath();

      // Diamond body
      g.fillStyle(color(k.color), 1);
      g.fillPoints([nose, left, bottom, right], true);

      // Cross sticks
      g.lineStyle(1.5, 0x000000, 0.35);
      g.beginPath();
      g.moveTo(nose.x, nose.y); g.lineTo(bottom.x, bottom.y);
      g.moveTo(left.x, left.y); g.lineTo(right.x, right.y);
      g.strokePath();
    }

    // A small spark where the strings cross (bigger while sawing), and a flash when one is cut
    function drawSparks(g, dt) {
      const sparkAt = (x, y, size, count) => {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const length = size * randomBetween(0.4, 1);
          g.lineStyle(1.5, Math.random() < 0.5 ? 0xffd166 : 0xffffff, 1);
          g.beginPath();
          g.moveTo(x, y);
          g.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
          g.strokePath();
        }
      };
      if (crossing.now) {
        sparkAt(crossing.now.x, crossing.now.y, 6 + 10 * crossing.sparkPower, 3 + Math.round(5 * crossing.sparkPower));
      }
      if (crossing.burst > 0) {
        sparkAt(crossing.burstX, crossing.burstY, 40 * crossing.burst, 14);
        crossing.burst = Math.max(0, crossing.burst - dt * 2.5);
      }
    }

    // The tension meter (yours): green, then yellow, then red at the top
    function drawTensionMeter(g) {
      const m = layout.meter;
      const zoneY = (fraction) => m.y + m.h * (1 - fraction); // turn 0..1 into a screen position

      // Faint coloured zones as the background
      g.fillStyle(0x2a9d4a, 0.25);
      g.fillRect(m.x, zoneY(SETTINGS.yellowZone), m.w, m.h * SETTINGS.yellowZone);
      g.fillStyle(0xe9c46a, 0.3);
      g.fillRect(m.x, zoneY(SETTINGS.redZone), m.w, m.h * (SETTINGS.redZone - SETTINGS.yellowZone));
      g.fillStyle(0xe63946, 0.3);
      g.fillRect(m.x, m.y, m.w, m.h * (1 - SETTINGS.redZone));

      // The filled part shows the current tension, coloured by its zone
      let fill = 0x2a9d4a;
      let alpha = 1;
      if (player.tension >= SETTINGS.redZone) {
        fill = 0xe63946;
        alpha = 0.6 + 0.4 * Math.sin(wind.time * 25); // flash while in the red
      } else if (player.tension >= SETTINGS.yellowZone) {
        fill = 0xe9c46a;
      }
      g.fillStyle(fill, alpha);
      g.fillRect(m.x, zoneY(player.tension), m.w, m.h * player.tension);

      // Outline
      g.lineStyle(1.5, color(SETTINGS.rooftopColor), 0.8);
      g.strokeRect(m.x, m.y, m.w, m.h);
    }

    // ----- Messages -----

    let messageText, hintText;

    // The round is over: show a message and wait for a tap or R
    function endRound(message) {
      if (game.over) return;
      game.over = true;
      game.endedAt = performance.now();
      messageText.setText(message).setVisible(true);
      hintText.setText("Tap or press R to restart").setVisible(true);
    }

    function hideMessage() {
      messageText.setVisible(false);
      hintText.setVisible(false);
    }

    function placeMessage() {
      messageText.setPosition(layout.width / 2, layout.height * 0.4);
      hintText.setPosition(layout.width / 2, layout.height * 0.4 + 44);
    }

    // ----- Restart, pause, slow motion, tuning panel -----

    function restart() {
      launchKite(player, -55);   // up and to the right of your rooftop
      launchKite(opponent, -110); // up and to the left of theirs
      brain.pulling = false;
      brain.switchIn = 1;
      brain.targetX = opponent.x;
      brain.targetY = opponent.y;
      crossing.now = crossing.before = null;
      crossing.burst = 0;
      game.over = false;
      hideMessage();
    }

    function togglePause() {
      game.paused = !game.paused;
      updateStatus();
    }

    function toggleSlowMotion() {
      game.slowMotion = !game.slowMotion;
      document.getElementById("slowButton").classList.toggle("on", game.slowMotion);
      updateStatus();
    }

    function updateStatus() {
      const words = [];
      if (game.paused) words.push("PAUSED");
      if (game.slowMotion) words.push("SLOW MOTION");
      document.getElementById("status").textContent = words.join(" · ");
    }

    // The tuning panel: live sliders for the most important settings
    let tuningPanel;
    let tuningPanelOpen = false;

    function createTuningPanel() {
      tuningPanel = new lil.GUI({ title: "Tuning" });
      tuningPanel.add(SETTINGS, "windStrength", 0, 600, 10).name("Wind strength");
      tuningPanel.add(SETTINGS, "windHeightGain", 0, 3, 0.1).name("Wind increase with height");
      tuningPanel.add(SETTINGS, "gustStrength", 0, 3, 0.1).name("Gust strength");
      tuningPanel.add(SETTINGS, "gustEvery", 1, 20, 0.5).name("Seconds between gusts");
      tuningPanel.add(SETTINGS, "gravity", 0, 600, 10).name("Gravity");
      tuningPanel.add(SETTINGS, "kiteWeight", 0.2, 5, 0.1).name("Kite weight");
      tuningPanel.add(SETTINGS, "pullStrength", 0, 1500, 10).name("Pull strength");
      tuningPanel.add(SETTINGS, "releaseSpeed", 0, 1, 0.01).name("Release speed");
      tuningPanel.add(SETTINGS, "steeringSensitivity", 0, 720, 10).name("Steering sensitivity");
      tuningPanel.add(SETTINGS, "tensionBuildUp", 0, 2, 0.01).name("Tension build-up speed");
      tuningPanel.add(SETTINGS, "snapTime", 0.2, 5, 0.1).name("Snap time (seconds)");
      tuningPanel.add(SETTINGS, "cutSensitivity", 0, 20, 0.5).name("Cut sensitivity");
      tuningPanel.add(SETTINGS, "opponentAggressiveness", 0, 1, 0.05).name("Opponent aggressiveness");
      tuningPanel.add({ copySettings }, "copySettings").name("📋 Copy settings");
      tuningPanel.show(false);
    }

    function toggleTuningPanel() {
      tuningPanelOpen = !tuningPanelOpen;
      tuningPanel.show(tuningPanelOpen);
      document.getElementById("gearButton").classList.toggle("on", tuningPanelOpen);
    }

    // Copy every setting as text, ready to paste into a message
    function copySettings() {
      const lines = Object.entries(SETTINGS).map(([name, value]) =>
        `  ${name}: ${typeof value === "string" ? `"${value}"` : Math.round(value * 1000) / 1000},`);
      const text = "const SETTINGS = {\n" + lines.join("\n") + "\n};";

      const done = () => {
        const button = tuningPanel.controllers[tuningPanel.controllers.length - 1];
        button.name("✅ Copied!");
        setTimeout(() => button.name("📋 Copy settings"), 1500);
      };
      // Try the modern way first, then an older way that works in more places
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, () => { oldStyleCopy(text); done(); });
      } else {
        oldStyleCopy(text);
        done();
      }
    }

    function oldStyleCopy(text) {
      const box = document.createElement("textarea");
      box.value = text;
      document.body.appendChild(box);
      box.select();
      document.execCommand("copy");
      box.remove();
    }

    // ----- Keyboard -----

    function setUpKeyboard() {
      const typingInPanel = (event) => ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName);

      window.addEventListener("keydown", (event) => {
        if (typingInPanel(event)) return;
        if (event.code === "Space") { controls.spaceDown = true; event.preventDefault(); }
        if (event.code === "ArrowLeft") { controls.leftDown = true; event.preventDefault(); }
        if (event.code === "ArrowRight") { controls.rightDown = true; event.preventDefault(); }
        if (event.repeat) return;
        if (event.code === "KeyR") restart();
        if (event.code === "KeyP") togglePause();
        if (event.code === "KeyS") toggleSlowMotion();
        if (event.code === "KeyT") toggleTuningPanel();
      });

      window.addEventListener("keyup", (event) => {
        if (event.code === "Space") controls.spaceDown = false;
        if (event.code === "ArrowLeft") controls.leftDown = false;
        if (event.code === "ArrowRight") controls.rightDown = false;
      });
    }

    // ----- Phaser scene: set up once, then update every frame -----

    let graphics;

    function create() {
      updateLayout(this.scale.width, this.scale.height);
      createWindLines();
      graphics = this.add.graphics();

      const textStyle = { fontFamily: "system-ui, sans-serif", color: "#ffffff", stroke: "#2b2d42", align: "center" };
      messageText = this.add.text(0, 0, "", { ...textStyle, fontSize: "32px", fontStyle: "bold", strokeThickness: 6 })
        .setOrigin(0.5).setVisible(false);
      hintText = this.add.text(0, 0, "", { ...textStyle, fontSize: "16px", strokeThickness: 4 })
        .setOrigin(0.5).setVisible(false);
      placeMessage();
      restart();

      // Mouse and touch both arrive here as "pointer" events
      this.input.on("pointerdown", (pointer) => {
        if (game.over) {
          // Wait a moment, so the press you were already holding doesn't restart straight away
          if (performance.now() - game.endedAt > 600) restart();
          return;
        }
        controls.pointerDown = true;
        controls.pointerStartX = pointer.x;
        controls.pointerX = pointer.x;
      });
      this.input.on("pointermove", (pointer) => { controls.pointerX = pointer.x; });
      this.input.on("pointerup", () => { controls.pointerDown = false; });
      this.input.on("pointerupoutside", () => { controls.pointerDown = false; });

      setUpKeyboard();
      createTuningPanel();
      document.getElementById("gearButton").addEventListener("click", toggleTuningPanel);
      document.getElementById("slowButton").addEventListener("click", toggleSlowMotion);

      // When the window changes size or the phone rotates, redo the layout
      this.scale.on("resize", (size) => {
        updateLayout(size.width, size.height);
        createWindLines();
        placeMessage();
      });
    }

    function update(time, delta) {
      // Seconds since the last frame (capped so a hiccup doesn't make things jump)
      let dt = Math.min(delta / 1000, 1 / 30);
      if (game.slowMotion) dt *= SETTINGS.slowMotionSpeed;
      if (game.paused) dt = 0;

      if (dt > 0) {
        updateWind(dt);
        updateWindLines(dt);
        updateKite(player, dt, readControls());
        updateKite(opponent, dt, opponentThinks(dt));
        for (const k of kites) updateLooseStrings(k, dt);
        updateCrossing(dt);
      }

      graphics.clear();
      drawWindLines(graphics);
      for (const k of kites) drawString(graphics, k);
      for (const k of kites) drawKite(graphics, k);
      drawRooftops(graphics);
      drawSparks(graphics, dt);
      drawTensionMeter(graphics);
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      parent: "game",
      transparent: true, // let the sky gradient show through
      scale: { mode: Phaser.Scale.RESIZE, width: window.innerWidth, height: window.innerHeight },
      scene: { create, update },
    });
  </script>
</body>
