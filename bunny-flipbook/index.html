<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe0f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Bunny Who Packed Too Much</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a2f27;
    --berry: #a8343a;
    --cream: #fbf1df;
    --paper: #f8ecd6;
    --turn: 850ms;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100vh; height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 115%, rgba(150, 190, 90, .55), transparent 55%),
      radial-gradient(ellipse at 50% -20%, #fffaf0 0%, transparent 60%),
      linear-gradient(180deg, #bfe0f3 0%, #dcefe9 55%, #f3ead2 100%);
    display: flex; flex-direction: column; align-items: stretch;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; touch-action: manipulation; }

  /* floating clouds */
  .cloud {
    position: fixed; z-index: 0; pointer-events: none;
    width: 180px; height: 60px; border-radius: 60px; background: rgba(255,255,255,.7);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 80px; height: 80px; left: 25px; top: -40px; }
  .cloud::after  { width: 60px; height: 60px; left: 90px; top: -25px; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 260px)); } }


  .stage {
    position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 2600px; perspective-origin: 50% 40%;
    touch-action: none;
    padding: max(8px, env(safe-area-inset-top)) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .book { position: relative; transform-style: preserve-3d; }

  /* ---------- hardcover case ----------
     Boards are a little bigger than the pages (--ov overhang), wrapped in
     book cloth, with the page block sitting on top of them. */
  :root {
    --cloth: #9c2f36;
    --cloth-dark: #6e1d24;
    --cloth-tex:
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
  }
  .base {
    position: absolute; top: calc(-1 * var(--ov)); height: calc(100% + 2 * var(--ov));
    background: var(--cloth-tex), var(--cloth); pointer-events: none;
  }
  .base::before {                       /* the page block resting on the board */
    content: ""; position: absolute; top: var(--ov); bottom: var(--ov); background: var(--paper);
  }
  .base.right {
    border-radius: 0 8px 8px 0;
    box-shadow: 1px 1px 0 var(--cloth-dark), 2px 2px 0 #5e171d, 3px 3px 0 #561419,
      14px 22px 40px rgba(60, 40, 20, .32);
  }
  .base.right::before {
    left: 0; right: var(--ov);
    box-shadow: 1px 0 0 #e8d8ba, 2px 1px 0 #fbf4e6, 3px 1px 0 #e2cfae, 0 2px 0 #e8d8ba, 0 3px 0 #d9c4a0;
  }
  .base.left {
    border-radius: 8px 0 0 8px;
    box-shadow: -1px 1px 0 var(--cloth-dark), -2px 2px 0 #5e171d, -3px 3px 0 #561419,
      -14px 22px 40px rgba(60, 40, 20, .32);
  }
  .base.left::before {
    right: 0; left: var(--ov);
    box-shadow: -1px 0 0 #e8d8ba, -2px 1px 0 #fbf4e6, -3px 1px 0 #e2cfae, 0 2px 0 #e8d8ba, 0 3px 0 #d9c4a0;
  }
  .single .base.left { display: none; }
  /* spine: shows between the boards above and below the open pages */
  .spine {
    position: absolute; top: calc(-1 * var(--ov)); height: calc(100% + 2 * var(--ov));
    pointer-events: none;
    background: var(--cloth-tex),
      linear-gradient(90deg, var(--cloth-dark), #8a262d 30%, #b23b42 50%, #8a262d 70%, var(--cloth-dark));
  }
  .spine::before, .spine::after {      /* little striped headbands */
    content: ""; position: absolute; left: 15%; right: 15%; height: max(3px, calc(var(--ov) * .45));
    background: repeating-linear-gradient(90deg, #f3e3c3 0 2px, #b23b42 2px 4px);
    border-radius: 2px;
  }
  .spine::before { top: calc(var(--ov) - max(3px, calc(var(--ov) * .45)) + 1px); }
  .spine::after  { bottom: calc(var(--ov) - max(3px, calc(var(--ov) * .45)) + 1px); }
  .single .spine { border-radius: 8px 0 0 8px;
    background: var(--cloth-tex), linear-gradient(90deg, #5a161c, var(--cloth-dark) 40%, #a5333a 85%, var(--cloth)); }
  .single .spine::before, .single .spine::after { display: none; }

  .leaf { position: absolute; top: 0; transform-origin: 0 50%; transform-style: preserve-3d; }
  .face {
    position: absolute; inset: 0; overflow: hidden; background: var(--paper);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face.front { border-radius: 0 4px 4px 0; }
  .face.back  { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
  .face img {
    width: 100%; height: 100%; display: block; object-fit: cover;
    pointer-events: none; -webkit-user-drag: none;
  }
  .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .spread .face.front::after {
    background: linear-gradient(90deg, rgba(60,35,15,.30) 0%, rgba(60,35,15,.10) 3%, rgba(255,255,255,.06) 6%, transparent 12%);
  }
  .spread .face.back::after {
    background: linear-gradient(270deg, rgba(60,35,15,.30) 0%, rgba(60,35,15,.10) 3%, rgba(255,255,255,.06) 6%, transparent 12%);
  }
  .single .face.front::after { background: linear-gradient(90deg, rgba(60,35,15,.18) 0%, transparent 4%); }
  .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .front .shade { background: linear-gradient(90deg, rgba(0,0,0,.05), rgba(0,0,0,.35) 70%, rgba(255,255,255,.25) 96%, rgba(0,0,0,.1)); }
  .back .shade  { background: linear-gradient(270deg, rgba(0,0,0,.05), rgba(0,0,0,.30) 70%, rgba(255,255,255,.25) 96%, rgba(0,0,0,.1)); }

  .leaf.hard .face {
    top: calc(-1 * var(--ov)); bottom: calc(-1 * var(--ov)); left: 0; right: calc(-1 * var(--ov));
    border-radius: 0 8px 8px 0; background: var(--cloth-tex), var(--cloth);
  }
  .leaf.hard .face.back { border-radius: 8px 0 0 8px; }
  /* printed cover: hinge groove near the spine + a soft laminated sheen */
  .leaf.hard .face.art::after {
    background:
      linear-gradient(90deg, rgba(0,0,0,.28) 0, rgba(0,0,0,.06) 2.2%, rgba(255,255,255,.38) 3.3%, rgba(0,0,0,.2) 4.4%, rgba(255,255,255,.08) 5.4%, transparent 7%),
      linear-gradient(118deg, rgba(255,255,255,.22), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.1));
  }
  .leaf.hard .face.back.art::after {
    background:
      linear-gradient(270deg, rgba(0,0,0,.28) 0, rgba(0,0,0,.06) 2.2%, rgba(255,255,255,.38) 3.3%, rgba(0,0,0,.2) 4.4%, rgba(255,255,255,.08) 5.4%, transparent 7%),
      linear-gradient(242deg, rgba(255,255,255,.22), rgba(255,255,255,0) 38%);
  }
  .leaf.hard .face.art { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), inset 0 0 6px rgba(0,0,0,.15); }
  /* inside of a board: endpaper pasted down, cloth turned in around it */
  .inside {
    position: absolute; top: calc(var(--ov) * 1.5); bottom: calc(var(--ov) * 1.5);
    overflow: hidden; container-type: inline-size;
    box-shadow: 0 0 0 1px rgba(80, 20, 20, .25), 0 0 4px rgba(60, 10, 10, .35);
  }
  .face.front > .inside { left: 0; right: calc(var(--ov) * 1.5); }
  .face.back > .inside { left: calc(var(--ov) * 1.5); right: 0; }
  .leaf.hard .face:not(.art)::after { z-index: 1; }
  /* board thickness, seen as the cover swings over */
  .edge {
    position: absolute; top: calc(-1 * var(--ov)); height: calc(100% + 2 * var(--ov));
    left: calc(100% + var(--ov)); width: var(--t);
    background: linear-gradient(90deg, #5e171d, #7d2229 50%, #5e171d);
    transform-origin: 0 50%;
    transform: translateZ(calc(var(--t) / 2)) rotateY(90deg);
  }

  .endpaper {
    width: 100%; height: 100%; background-color: #f6e2cf;
    background-image:
      radial-gradient(circle at 25% 30%, #d9545c 0 5%, transparent 5.5%),
      radial-gradient(circle at 75% 80%, #e8b34a 0 3.5%, transparent 4%),
      radial-gradient(circle at 70% 25%, #8bbf6a 0 2.5%, transparent 3%);
    background-size: 64px 64px;
    display: flex; align-items: center; justify-content: center;
  }
  .endpaper .tag {
    background: var(--cream); padding: 14px 20px; border-radius: 14px;
    font-family: "Fredoka", sans-serif; color: var(--berry);
    box-shadow: 0 4px 14px rgba(120, 60, 30, .18); text-align: center;
    font-size: clamp(12px, 1.4vw, 18px); line-height: 1.3;
  }
  .endpaper .tag small { display: block; color: var(--ink); opacity: .65; font-family: "Nunito", sans-serif; font-size: .75em; }
  /* ---------- extra pages: name plate, The End, meet the friends ---------- */
  .face { container-type: inline-size; }
  .xpage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5cqw; padding: 8cqw 7cqw; text-align: center;
  }
  .card {
    background: var(--cream); border-radius: 4cqw; padding: 6cqw 7cqw;
    box-shadow: 0 1.2cqw 4cqw rgba(120, 60, 30, .18); width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 2.5cqw;
  }
  .xpage h3 {
    margin: 0; font-family: "Fredoka", sans-serif; font-weight: 600; line-height: 1.05;
    color: var(--berry); font-size: 11cqw;
  }
  .xpage h4 {
    margin: 0; font-family: "Fredoka", sans-serif; font-weight: 600; line-height: 1.1;
    color: var(--berry); font-size: 7.4cqw;
  }
  .xpage p { margin: 0; font-size: 4.6cqw; line-height: 1.35; color: var(--ink); }
  .xpage .soft { opacity: .7; }
  .belongs { font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 6.5cqw; color: var(--ink); }
  .name {
    width: 100%; border: 0; border-bottom: .6cqw dashed #c98b6b; background: transparent;
    font-family: "Patrick Hand", "Comic Sans MS", cursive; font-size: 10cqw; color: #2d5d9a;
    text-align: center; padding: 1cqw 0; outline: none; border-radius: 0;
    -webkit-user-select: text; user-select: text;
  }
  .name::placeholder { color: #c9a58d; opacity: 1; }
  .name:focus { border-bottom-style: solid; border-bottom-color: var(--berry); }
  .stamp { width: 62%; aspect-ratio: 480 / 280; object-fit: cover; border-radius: 50%;
    -webkit-mask-image: radial-gradient(closest-side, #000 70%, transparent);
            mask-image: radial-gradient(closest-side, #000 70%, transparent); }
  .again {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    background: var(--berry); color: #fff; font-weight: 700; font-family: "Nunito", sans-serif;
    font-size: max(13px, 4.6cqw); padding: 2.6cqw 6cqw; margin-top: 1cqw;
    box-shadow: 0 .8cqw 0 #7c2329, 0 2cqw 5cqw rgba(120, 40, 40, .25);
  }
  .again:active { transform: translateY(.6cqw); box-shadow: 0 .2cqw 0 #7c2329; }
  .friends {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4cqw 3cqw; width: 100%;
  }
  .friend {
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    width: 28%; display: flex; flex-direction: column; align-items: center; gap: 1cqw;
    color: var(--ink); font-family: "Nunito", sans-serif;
  }
  .friend img {
    width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; display: block;
    border: 1.2cqw solid #fffaf0; box-shadow: 0 1cqw 3cqw rgba(80, 50, 20, .25);
    pointer-events: none;
  }
  .friend b { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 5cqw; color: var(--berry); line-height: 1; margin-top: 1cqw; }
  .friend small { font-size: 3.4cqw; line-height: 1.2; opacity: .8; }
  .friend.boing img { animation: boing .7s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes boing { 30% { transform: translateY(-12%) scale(1.08, .94); } 60% { transform: translateY(0) scale(.96, 1.04); } }
  .single .xpage { gap: 3cqw; padding: 6cqw 6cqw; }
  .single .friend { width: 27%; }
  .plain-back { width: 100%; height: 100%; background: linear-gradient(90deg, #efe0c4, var(--paper) 30%, #f3e6cd); }
  .credit {
    position: absolute; left: 50%; bottom: 1.6%; transform: translateX(-50%);
    background: rgba(255, 250, 240, .92); color: var(--ink);
    font-family: "Fredoka", sans-serif; font-weight: 500;
    font-size: clamp(11px, 3.2vw, 16px); white-space: nowrap;
    padding: .35em 1em; border-radius: 999px; box-shadow: 0 2px 8px rgba(60, 40, 20, .2);
  }

  /* ---------- controls ---------- */
  .controls {
    position: relative; z-index: 2; flex: 0 0 auto;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: center;
    padding: 8px 12px max(12px, env(safe-area-inset-bottom));
  }
  .group { display: flex; gap: 10px; align-items: center; }
  .btn {
    appearance: none; border: 0; cursor: pointer; flex: none;
    width: 48px; height: 48px; border-radius: 50%;
    background: #fffaf0; color: var(--berry);
    box-shadow: 0 3px 0 #e3c9a4, 0 6px 16px rgba(80, 50, 20, .18);
    display: grid; place-items: center;
    transition: transform .15s, opacity .2s, background .2s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e3c9a4, 0 3px 8px rgba(80,50,20,.18); }
  @media (hover: hover) { .btn:not(:disabled):hover { transform: translateY(-2px); } }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:focus-visible, .pill:focus-visible, .thumb:focus-visible { outline: 3px solid #2d6fb0; outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; }
  .btn.small { width: 44px; height: 44px; }
  .btn.small svg { width: 19px; height: 19px; }
  .pill {
    appearance: none; border: 0; cursor: pointer; height: 44px; border-radius: 999px;
    padding: 0 16px; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 250, 240, .9); color: var(--ink); font-weight: 700; font-size: 15px;
    box-shadow: 0 2px 8px rgba(80, 50, 20, .14); white-space: nowrap;
  }
  .pill svg { width: 18px; height: 18px; flex: none; color: var(--berry); }
  .counter { min-width: 150px; justify-content: center; }
  .progress {
    position: absolute; left: 0; top: 0; height: 3px; width: 0;
    background: var(--berry); border-radius: 0 3px 3px 0; opacity: .45; transition: width .5s ease;
  }

  .toast {
    position: absolute; z-index: 5; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(74, 47, 39, .9); color: #fff; font-size: 14px; padding: 8px 8px 8px 16px;
    border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 8px;
    transition: opacity .5s, transform .5s; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .toast.hide { opacity: 0; pointer-events: none; transform: translate(-50%, 10px); }
  .toast.hint { padding: 8px 16px; pointer-events: none; }
  .toast button {
    border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 13px;
    background: #fffaf0; color: var(--berry);
  }
  .toast button.x { background: transparent; color: #fff; padding: 7px 9px; }

  /* ---------- page picker ---------- */
  .picker {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(40, 30, 25, .45); opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .picker.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(960px, 100%); max-height: 82dvh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--cream); border-radius: 22px 22px 0 0;
    padding: 14px 16px max(18px, env(safe-area-inset-bottom));
    transform: translateY(30px); transition: transform .3s;
  }
  .picker.open .sheet { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .sheet-head h2 { margin: 0; font-family: "Fredoka", sans-serif; font-size: 20px; color: var(--berry); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  .thumb {
    appearance: none; border: 0; padding: 0; background: none; cursor: pointer; text-align: center;
    color: var(--ink); font-weight: 700; font-size: 13px;
  }
  .thumb img {
    width: 100%; aspect-ratio: 1000 / 1334; object-fit: cover; display: block; border-radius: 8px;
    box-shadow: 0 3px 10px rgba(80, 50, 20, .2); background: var(--paper);
  }
  .thumb span { display: block; margin-top: 5px; }
  .thumb.current img { outline: 3px solid var(--berry); outline-offset: 2px; }

  .loading {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: #dcefe9; transition: opacity .5s;
    font-family: "Fredoka", sans-serif; color: var(--berry); font-size: 20px;
  }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading .hop { display: inline-block; animation: hop .6s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-14px); } }

  /* phones held upright: primary nav on one row, tools on the next */
  @media (max-width: 600px) {
    .group.nav, .group.tools { flex-basis: 100%; justify-content: center; }
    .controls { gap: 10px; }
    .counter { min-width: 0; flex: 1 1 auto; max-width: 200px; }
    .cloud { opacity: .5; }
  }
  /* phones held sideways: every pixel goes to the book */
  @media (max-height: 500px) and (orientation: landscape) {
    .controls { padding-top: 4px; padding-bottom: max(6px, env(safe-area-inset-bottom)); gap: 8px 14px; }
    .btn { width: 40px; height: 40px; } .btn.small { width: 38px; height: 38px; }
    .pill { height: 38px; font-size: 14px; padding: 0 12px; }
    .cloud { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { display: none; }
  }
  .thumb .mini {
    width: 100%; aspect-ratio: 1000 / 1334; border-radius: 8px; display: grid; place-items: center;
    box-shadow: 0 3px 10px rgba(80, 50, 20, .2);
    font-family: "Fredoka", sans-serif; color: var(--berry); font-size: 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="cloud" style="top:12%; animation-duration:95s; animation-delay:-20s"></div>
  <div class="cloud" style="top:30%; transform:scale(.7); animation-duration:130s; animation-delay:-80s; opacity:.6"></div>


  <main class="stage" id="stage" aria-label="Storybook. Tap the right side to turn forward, the left side to go back.">
    <div class="book" id="book"></div>
    <div class="toast hint" id="hint">Tap, swipe or drag a page to turn it</div>
    <div class="toast hide" id="resume">
      <span id="resumeText">Continue where you left off?</span>
      <button id="resumeGo">Continue</button>
      <button class="x" id="resumeX" aria-label="Dismiss">✕</button>
    </div>
  </main>

  <nav class="controls" aria-label="Book controls">
    <div class="progress" id="progress"></div>
    <div class="group nav">
      <button class="btn" id="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="pill counter" id="counter" aria-haspopup="dialog" aria-label="Choose a page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span id="counterText">Cover</span>
      </button>
      <button class="btn" id="next" aria-label="Next page">
        <svg id="nextIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        <svg id="againIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
    <div class="group tools">
      <button class="btn small" id="sound" aria-label="Page-turn sound on" aria-pressed="true">
        <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/></svg>
        <svg id="soundOff" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <button class="btn small" id="full" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </nav>

  <div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="pickerTitle">Jump to a page</h2>
        <button class="btn small" id="pickerClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="loading" id="loading"><div><span class="hop">🐰</span> Opening the book…</div></div>

<script>
(() => {
  const PAGE_COUNT = 19;
  const RATIO = 1334 / 1000;            // page height / width
  const src = n => `pages/${String(n).padStart(2, "0")}.webp`;
  const asset = name => `friends/${name}.webp`;
  const FRIENDS_PAGE = 18.5;            // the "meet the friends" page sits between 18 and the back cover

  // The words on each page (alt text for screen readers).
  const TEXT = {
    1: "The Bunny Who Packed Too Much. By Aakansha Singh.",
    2: "The Bunny Who Packed Too Much. By Aakansha Singh.",
    3: "Pip sniffed the air. “It’s a picnic day!”",
    4: "He packed two strawberry buns. Then he gave one a little sniff. “See you at lunch.”",
    5: "Pip hugged his cushion. “You’re coming, too.”",
    6: "In went the cushion, the teapot, and the little stool. “Right. Now I’m ready.”",
    7: "Pip took three big hops. Hop, hop, hop!",
    8: "The cushion took four. Boing, boing, boing, boing!",
    9: "Plop! “Oh!” said a duckling. “A seat!”",
    10: "“I’m Pip. Want to come?” “I’m Dot. Wait for me!” She scooped up the cushion.",
    11: "Clonk! Out fell the stool. Up scrambled Pipkin. “Wait!” squeaked Poppy.",
    12: "“Giddy-up!” said Poppy. The stool stayed put. Pip grinned. “Bring your pony.”",
    13: "“Got it!” said Hazel. “I brought strawberries!”",
    14: "“I brought cups!” said Pip. He poked around in the basket. “Well… I brought a cup.”",
    15: "Buns for five. Strawberries, too!",
    16: "“My turn!” said Poppy. Up she went with the cup. Pipkin held her tail. “Steady… steady… sip!”",
    17: "Pip was almost inside. “Tomorrow?” called Dot.",
    18: "Pip looked at the sofa. “Think we could carry that?”",
    19: "Pip is off on a picnic with two strawberry buns and a very full basket. Every time something falls out, someone new comes along. Will two buns be enough for five hungry friends?",
  };
  // Reader-facing numbers: story pages count from 1, covers and title page are named.
  const pageName = p => p === 1 ? "Cover" : p === 2 ? "Title" : p === PAGE_COUNT ? "Back" : p === 18.5 ? "Friends" : String(p - 2);
  const STORY_PAGES = PAGE_COUNT - 3;

  const $ = id => document.getElementById(id);
  const stage = $("stage"), book = $("book"), hint = $("hint");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TURN_MS = reduceMotion ? 380 : 850;

  // ---------- leaves ----------
  const img = n => ({ page: n });
  const FRIENDS = [
    ["pip", "Pip", "packed too much"],
    ["dot", "Dot", "found a comfy seat"],
    ["pipkin", "Pipkin", "scrambled up the stool"],
    ["poppy", "Poppy", "shouted “Giddy-up!”"],
    ["hazel", "Hazel", "brought strawberries"],
  ];
  const friendsHTML = () => '<div class="friends">' + FRIENDS.map(([k, name, what]) =>
    `<button class="friend interactive" aria-label="${name}, who ${what.replace(/[“”]/g, "")}">` +
    `<img src="${asset(k)}" alt="" draggable="false"><b>${name}</b><small>${what}</small></button>`).join("") + "</div>";
  const AGAIN = '<button class="again interactive" data-again>Read it again ↺</button>';

  // inside front cover: a child writes their name in the book
  const NAMEPLATE = { html:
    '<div class="endpaper xpage"><div class="card">' +
    '<div class="belongs">This book belongs to</div>' +
    '<input class="name interactive" id="ownerName" maxlength="24" placeholder="write your name" aria-label="Reader’s name" autocomplete="off" autocapitalize="words" spellcheck="false">' +
    '<p class="soft">a very good reader ♡</p></div></div>' };
  // inside back cover, left: The End
  const THE_END = { html:
    '<div class="endpaper xpage"><div class="card">' +
    `<img class="stamp" src="${asset("buns")}" alt="" draggable="false">` +
    '<h3>The End</h3><p class="soft">Tomorrow… the sofa?</p>' + AGAIN + '</div></div>' };
  // inside back cover, right: meet the friends
  const MEET = { html:
    '<div class="endpaper xpage"><div class="card"><h4>Meet the picnic friends</h4>' + friendsHTML() +
    '<p class="soft">Tap a friend to say hello!</p></div></div>' };
  // phones: The End and the friends share one page
  const END_SINGLE = { html:
    '<div class="endpaper xpage"><div class="card"><h3>The End</h3><p class="soft">Meet the picnic friends</p>' +
    friendsHTML() + AGAIN + '</div></div>' };
  const PLAIN = { html: '<div class="plain-back"></div>' };
  const DOTS = { html: '<div class="endpaper"></div>' };

  // Two-page spreads. The artwork is painted across 3|4, 5|6, 7|8 … 17|18,
  // so the cover and title page stand alone and the back cover closes the book.
  function spreadLeaves() {
    const L = [];
    L.push({ front: img(1), back: NAMEPLATE, hard: true });
    L.push({ front: img(2), back: img(3) });
    for (let p = 4; p <= 16; p += 2) L.push({ front: img(p), back: img(p + 1) });
    L.push({ front: img(18), back: THE_END });
    L.push({ front: MEET, back: img(19), hard: true });
    return L;
  }
  // Phone: one page at a time. The inside title page only repeats the cover,
  // so it is skipped and the author credit moves onto the cover instead.
  const SINGLE_PAGES = [1, ...Array.from({ length: PAGE_COUNT - 3 }, (_, i) => i + 3), FRIENDS_PAGE, PAGE_COUNT];
  function singleLeaves() {
    return SINGLE_PAGES.map(p => ({
      front: p === 1 ? { page: 1, credit: true } : p === FRIENDS_PAGE ? END_SINGLE : img(p),
      back: p === 1 ? DOTS : PLAIN, hard: p === 1 || p === PAGE_COUNT,
    }));
  }

  // ---------- state ----------
  let mode = null;          // "spread" | "single"
  let leaves = [];
  let target = 0;           // number of leaves that are (or will be) turned
  let pageW = 300, pageH = 400;
  const anims = new Map();  // leafIndex -> animation
  let drag = null;

  function faceHTML(d) {
    if (d.page) {
      const alt = (TEXT[d.page] || "").replace(/"/g, "&quot;");
      return `<img src="${src(d.page)}" alt="${alt}" draggable="false" decoding="async">` +
        (d.credit ? '<div class="credit">by Aakansha Singh</div>' : "");
    }
    return d.html;
  }

  function build(newMode, keepPage) {
    mode = newMode;
    document.body.classList.toggle("spread", mode === "spread");
    document.body.classList.toggle("single", mode === "single");
    anims.clear(); drag = null;
    book.innerHTML = '<div class="base left"></div><div class="base right"></div><div class="spine"></div>';
    const data = mode === "spread" ? spreadLeaves() : singleLeaves();
    leaves = data.map(d => {
      const el = document.createElement("div");
      el.className = "leaf" + (d.hard ? " hard" : "");
      // on a hardcover board, non-picture sides are endpapers pasted inside the cloth
      const side = (x, cls) => {
        const art = !!x.page;
        const inner = d.hard && !art ? `<div class="inside">${faceHTML(x)}</div>` : faceHTML(x);
        return `<div class="face ${cls}${art ? " art" : ""}"${cls === "back" ? ' aria-hidden="true"' : ""}>${inner}<div class="shade"></div></div>`;
      };
      el.innerHTML = side(d.front, "front") + side(d.back, "back") + (d.hard ? '<div class="edge"></div>' : "");
      book.appendChild(el);
      return {
        el, data: d, angle: 0,
        frontShade: el.querySelector(".front .shade"),
        backShade: el.querySelector(".back .shade"),
        back: el.querySelector(".face.back"),
      };
    });
    target = pageToTarget(keepPage || 1);
    leaves.forEach((l, i) => l.angle = i < target ? -180 : 0);
    buildPicker();
    wirePages();
    layout();
  }

  // map between "a page number being viewed" and "leaves turned"
  function pageToTarget(p) {
    if (mode === "single") {
      const i = SINGLE_PAGES.findIndex(s => s >= p);
      return i < 0 ? SINGLE_PAGES.length - 1 : i;
    }
    if (p <= 1) return 0;
    if (p === 2) return 1;
    if (p >= PAGE_COUNT) return leaves.length;
    if (p === FRIENDS_PAGE) return leaves.length - 1;
    return Math.floor(p / 2);            // 3|4 -> 2 ... 17|18 -> 9
  }
  // pages visible right now
  function visiblePages() {
    if (mode === "single") return [SINGLE_PAGES[target]];
    const n = leaves.length;
    if (target === 0) return [1];
    if (target >= n) return [PAGE_COUNT];
    if (target === n - 1) return [FRIENDS_PAGE];
    return [leaves[target - 1].data.back.page, leaves[target].data.front.page].filter(Boolean);
  }
  const currentPage = () => {
    const v = visiblePages();
    return v.length ? v[v.length - 1] : (target === 0 ? 1 : PAGE_COUNT - 1);
  };
  const maxTarget = () => mode === "single" ? leaves.length - 1 : leaves.length;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function layout() {
    const r = stage.getBoundingClientRect();
    const pages = mode === "spread" ? 2 : 1;
    // leave room for the boards, which overhang the pages by ~3%
    const availW = (r.width - 24) / (pages + (mode === "single" ? .09 : .07));
    const availH = (r.height - (mode === "single" ? 20 : 40)) / (RATIO + .07);
    pageW = Math.floor(Math.min(availW, availH));
    const ov = Math.max(5, Math.round(pageW * .03));
    book.style.setProperty("--ov", ov + "px");
    book.style.setProperty("--t", Math.max(4, Math.round(pageW * .014)) + "px");
    pageH = Math.floor(pageW * RATIO);
    book.style.width = pageW * pages + "px";
    book.style.height = pageH + "px";
    const left = mode === "spread" ? pageW : 0;
    leaves.forEach(l => {
      l.el.style.left = left + "px";
      l.el.style.width = pageW + "px";
      l.el.style.height = pageH + "px";
    });
    const [bl, br] = book.querySelectorAll(".base");
    bl.style.left = -ov + "px"; bl.style.width = pageW + ov + "px";
    br.style.left = left + "px"; br.style.width = pageW + ov + "px";
    const sp = book.querySelector(".spine");
    if (mode === "spread") { sp.style.left = pageW - ov + "px"; sp.style.width = 2 * ov + "px"; }
    else { sp.style.left = -Math.round(ov * 1.1) + "px"; sp.style.width = Math.round(ov * 1.1) + "px"; }
    stage.style.perspective = (pageW * 7) + "px";
    render();
  }

  // ---------- rendering ----------
  function render() {
    const n = leaves.length;
    let pos = 0;
    // only leaves near the open spread (or in motion) need to be drawn;
    // hiding the rest keeps phones from compositing 19 full-size pages
    const near = new Set([target - 2, target - 1, target, target + 1]);
    leaves.forEach((l, i) => { const t = -l.angle / 180; if (t > 0 && t < 1) [i - 1, i, i + 1].forEach(k => near.add(k)); });

    leaves.forEach((l, i) => {
      const a = l.angle;
      const t = -a / 180;
      pos += t;
      const moving = t > 0 && t < 1;
      const lift = moving ? Math.sin(t * Math.PI) * 8 : 0;
      l.el.style.transform = `translateZ(${lift}px) rotateY(${a}deg)`;
      l.el.style.willChange = moving ? "transform" : "auto";
      l.el.style.zIndex = !moving ? (t === 0 ? n - i : i) : (a > -90 ? 3 * n - i : 3 * n + i);
      const s = Math.sin(t * Math.PI);
      l.frontShade.style.opacity = moving && t < .5 ? s * .9 : 0;
      l.backShade.style.opacity = moving && t > .5 ? s * .9 : 0;
      let visible = near.has(i);
      if (mode === "single") {
        if (t >= 1) visible = false;
        l.back.style.opacity = t > .5 ? Math.max(0, 1 - (t - .5) * 2.2) : 1;
      }
      l.el.style.visibility = visible ? "visible" : "hidden";
    });

    const [bl, br] = book.querySelectorAll(".base");
    if (mode === "spread") {
      const shift = -pageW / 2 * clamp(1 - pos, 0, 1) + pageW / 2 * clamp(pos - (n - 1), 0, 1);
      book.style.transform = `translateX(${shift}px)`;
      bl.style.opacity = pos > .5 ? 1 : 0;
      br.style.opacity = n - pos > .5 ? 1 : 0;
      book.querySelector(".spine").style.opacity = pos > .5 && n - pos > .5 ? 1 : 0;
    } else {
      book.style.transform = "";
      br.style.opacity = 1;
    }
  }

  function updateUI() {
    const n = leaves.length, atEnd = target >= maxTarget();
    $("prev").disabled = target <= 0;
    $("nextIcon").classList.toggle("hidden", atEnd);
    $("againIcon").classList.toggle("hidden", !atEnd);
    $("next").setAttribute("aria-label", atEnd ? "Read again from the cover" : "Next page");
    let label;
    if (target === 0) label = "Cover";
    else if (atEnd) label = "Back cover";
    else if (mode === "spread" && target === 1) label = "Title page";
    else if (mode === "spread" && target === n - 1) label = "The End";
    else if (visiblePages()[0] === FRIENDS_PAGE) label = "The End";
    else {
      const v = visiblePages().map(p => p - 2);
      label = v.length > 1 ? `Pages ${v[0]}–${v[1]} of ${STORY_PAGES}` : `Page ${v[0]} of ${STORY_PAGES}`;
    }
    $("counterText").textContent = label;
    $("progress").style.width = (target / maxTarget() * 100) + "%";
    store(currentPage());
    markPicker();
  }

  // ---------- animation ----------
  let raf = 0;
  function animateLeaf(i, to, duration, delay = 0) {
    anims.set(i, { from: leaves[i].angle, to, start: performance.now() + delay, duration });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    anims.forEach((a, i) => {
      if (now < a.start) return;
      const k = clamp((now - a.start) / a.duration, 0, 1);
      leaves[i].angle = a.from + (a.to - a.from) * ease(k);
      if (k >= 1) anims.delete(i);
    });
    render();
    raf = anims.size ? requestAnimationFrame(tick) : 0;
  }
  function finishAnims() {
    anims.forEach((a, i) => leaves[i].angle = a.to);
    anims.clear();
    render();
  }

  let lastDir = 0;
  const busyOpposite = dir => anims.size > 0 && lastDir !== dir;
  const turnTime = i => leaves[i].data.hard ? TURN_MS + 150 : TURN_MS;

  function next() {
    if (drag || busyOpposite(1)) return;
    if (target >= maxTarget()) { goTo(0); return; }
    lastDir = 1;
    const i = target++;
    animateLeaf(i, -180, turnTime(i));
    turned();
  }
  function prev() {
    if (drag || target <= 0 || busyOpposite(-1)) return;
    lastDir = -1;
    const i = --target;
    animateLeaf(i, 0, turnTime(i));
    turned();
  }
  // jump several leaves at once: they fan over in a quick ripple
  function goTo(t) {
    t = clamp(t, 0, maxTarget());
    if (t === target || drag) return;
    finishAnims();
    const dir = t > target ? 1 : -1;
    lastDir = dir;
    const steps = Math.abs(t - target);
    const gap = Math.min(110, 700 / steps);
    for (let k = 0; k < steps; k++) {
      const i = dir === 1 ? target + k : target - 1 - k;
      animateLeaf(i, dir === 1 ? -180 : 0, reduceMotion ? 300 : 650, k * gap);
    }
    target = t;
    turned();
  }
  function turned(vol = 1) {
    flipSound(vol);
    if (navigator.vibrate && matchMedia("(pointer: coarse)").matches) { try { navigator.vibrate(8); } catch (_) {} }
    hideToasts();
    updateUI();
  }

  // ---------- pointer: tap or drag pages ----------
  stage.addEventListener("pointerdown", e => {
    if ((e.button && e.button !== 0) || anims.size) return;
    if (e.target.closest(".toast, .interactive")) return;
    const r = book.getBoundingClientRect();
    if (e.clientX < r.left - 30 || e.clientX > r.right + 30 || e.clientY < r.top - 30 || e.clientY > r.bottom + 30) return;
    const rel = (e.clientX - r.left) / r.width;
    const dir = mode === "spread" ? (rel >= .5 ? 1 : -1) : (rel >= .3 ? 1 : -1);
    if (dir === 1 && target >= maxTarget()) return;
    if (dir === -1 && target <= 0) return;
    drag = { dir, x0: e.clientX, y0: e.clientY, x: e.clientX, t0: performance.now(), active: false, leaf: dir === 1 ? target : target - 1 };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.x = e.clientX;
    const dx = drag.x - drag.x0;
    if (!drag.active) {
      if (Math.abs(dx) < 8) return;
      drag.active = true; hideToasts();
      // a swipe in the other direction than where it started still counts
      const swipeDir = dx < 0 ? 1 : -1;
      if (swipeDir !== drag.dir) {
        if ((swipeDir === 1 && target >= maxTarget()) || (swipeDir === -1 && target <= 0)) { drag = null; return; }
        drag.dir = swipeDir; drag.leaf = swipeDir === 1 ? target : target - 1;
      }
    }
    const span = mode === "spread" ? pageW * 1.6 : pageW * 1.1;
    drag.p = clamp((drag.dir === 1 ? -dx : dx) / span, 0, 1);
    leaves[drag.leaf].angle = drag.dir === 1 ? -180 * drag.p : -180 * (1 - drag.p);
    render();
  });
  const endDrag = e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.active) {
      if (e.type === "pointerup") d.dir === 1 ? next() : prev();
      return;
    }
    const dt = performance.now() - d.t0;
    const flick = Math.abs(d.x - d.x0) / dt > .45 && (d.dir === 1 ? d.x < d.x0 : d.x > d.x0);
    const complete = (d.p || 0) > .3 || flick;
    const l = leaves[d.leaf];
    lastDir = d.dir;
    if (complete) {
      const to = d.dir === 1 ? -180 : 0;
      target += d.dir;
      animateLeaf(d.leaf, to, 300 + 500 * Math.abs(to - l.angle) / 180);
      turned(.6);
    } else {
      const to = d.dir === 1 ? 0 : -180;
      animateLeaf(d.leaf, to, 250 + 350 * Math.abs(to - l.angle) / 180);
    }
  };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("contextmenu", e => e.preventDefault());

  // ---------- buttons + keyboard ----------
  $("next").onclick = next;
  $("prev").onclick = prev;
  addEventListener("keydown", e => {
    if (picker.classList.contains("open")) { if (e.key === "Escape") closePicker(); return; }
    if (e.target.closest && e.target.closest("input, textarea")) { if (e.key === "Enter" || e.key === "Escape") e.target.blur(); return; }
    if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") goTo(0);
    else if (e.key === "End") goTo(maxTarget());
  });

  // ---------- things you can touch on the extra pages ----------
  let ownerName = "";
  try { ownerName = localStorage.getItem("bunny-owner") || ""; } catch (_) {}
  function wirePages() {
    const input = book.querySelector("#ownerName");
    if (input) {
      input.value = ownerName;
      input.addEventListener("input", () => {
        ownerName = input.value;
        try { localStorage.setItem("bunny-owner", ownerName); } catch (_) {}
      });
    }
    book.querySelectorAll("[data-again]").forEach(b => b.addEventListener("click", () => goTo(0)));
    book.querySelectorAll(".friend").forEach(b => b.addEventListener("click", () => {
      b.classList.remove("boing"); void b.offsetWidth; b.classList.add("boing");
      popSound();
    }));
  }

  // ---------- page picker ----------
  const picker = $("picker"), grid = $("grid");
  function buildPicker() {
    const list = mode === "single" ? SINGLE_PAGES : [...Array.from({ length: PAGE_COUNT - 1 }, (_, i) => i + 1), FRIENDS_PAGE, PAGE_COUNT];
    grid.innerHTML = list.map(p =>
      `<button class="thumb" data-page="${p}" aria-label="${p === 1 ? "Cover" : p === 2 ? "Title page" : p === PAGE_COUNT ? "Back cover" : p === FRIENDS_PAGE ? "The End and the picnic friends" : "Page " + (p - 2)}">` +
      (p === FRIENDS_PAGE ? '<div class="mini endpaper">The End</div>' : `<img src="${src(p)}" alt="" loading="lazy" decoding="async">`) +
      `<span>${pageName(p)}</span></button>`).join("");
  }
  function markPicker() {
    const vis = visiblePages();
    grid.querySelectorAll(".thumb").forEach(b => b.classList.toggle("current", vis.includes(+b.dataset.page)));
  }
  function openPicker() {
    markPicker();
    picker.classList.add("open");
    const cur = grid.querySelector(".current");
    (cur || $("pickerClose")).focus({ preventScroll: true });
    if (cur) cur.scrollIntoView({ block: "center" });
  }
  function closePicker() { picker.classList.remove("open"); $("counter").focus({ preventScroll: true }); }
  $("counter").onclick = openPicker;
  $("pickerClose").onclick = closePicker;
  picker.addEventListener("click", e => {
    const b = e.target.closest(".thumb");
    if (b) { closePicker(); setTimeout(() => goTo(pageToTarget(+b.dataset.page)), 220); }
    else if (e.target === picker) closePicker();
  });

  // ---------- page-turn sound (synthesised paper rustle) ----------
  let audio = null, soundOn = true;
  try { soundOn = localStorage.getItem("bunny-sound") !== "off"; } catch (_) {}
  function flipSound(vol = 1) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const dur = .45, sr = audio.sampleRate;
      const buf = audio.createBuffer(1, Math.floor(sr * dur), sr);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) {
        const t = i / ch.length;
        const env = Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.25)), 2) * (1 - t);
        ch[i] = (Math.random() * 2 - 1) * env * (0.6 + 0.4 * Math.random());
      }
      const s = audio.createBufferSource(); s.buffer = buf;
      const bp = audio.createBiquadFilter(); bp.type = "bandpass";
      bp.frequency.setValueAtTime(1800, audio.currentTime);
      bp.frequency.linearRampToValueAtTime(3800, audio.currentTime + dur);
      bp.Q.value = .7;
      const g = audio.createGain(); g.gain.value = .22 * vol;
      s.connect(bp).connect(g).connect(audio.destination);
      s.start();
    } catch (_) {}
  }
  // a cheerful little "boop" when a friend says hello
  function popSound() {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(980, t + .12);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .22);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + .25);
    } catch (_) {}
  }
  function setSoundUI() {
    $("soundOn").classList.toggle("hidden", !soundOn);
    $("soundOff").classList.toggle("hidden", soundOn);
    $("sound").setAttribute("aria-pressed", soundOn);
    $("sound").setAttribute("aria-label", soundOn ? "Page-turn sound on" : "Page-turn sound off");
  }
  $("sound").onclick = () => {
    soundOn = !soundOn; setSoundUI();
    try { localStorage.setItem("bunny-sound", soundOn ? "on" : "off"); } catch (_) {}
  };
  setSoundUI();

  // ---------- full screen (hidden where the browser can't, e.g. iPhone) ----------
  const root = document.documentElement;
  const canFull = root.requestFullscreen || root.webkitRequestFullscreen;
  if (!canFull || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $("full").classList.add("hidden");
  $("full").onclick = () => {
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (isFull) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const p = canFull.call(root);
        if (p && p.catch) p.catch(() => {});
        if (screen.orientation && screen.orientation.lock && innerWidth > innerHeight) screen.orientation.lock("landscape").catch(() => {});
      }
    } catch (_) {}
  };

  // ---------- remember where the reader was ----------
  let saved = 0;
  try { saved = +localStorage.getItem("bunny-page") || 0; } catch (_) {}
  function store(p) { try { localStorage.setItem("bunny-page", p); } catch (_) {} }

  const resume = $("resume");
  function hideToasts() { hint.classList.add("hide"); resume.classList.add("hide"); }
  $("resumeX").onclick = hideToasts;
  $("resumeGo").onclick = () => { hideToasts(); goTo(pageToTarget(saved)); };

  // ---------- responsive mode ----------
  const pickMode = () => {
    const r = stage.getBoundingClientRect();
    // a spread needs room for two portrait pages side by side
    return r.width / r.height > 1.05 && r.width >= 560 ? "spread" : "single";
  };
  let resizeT;
  const onResize = () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      finishAnims();
      const m = pickMode();
      if (m !== mode) { build(m, currentPage()); updateUI(); } else layout();
    }, 120);
  };
  addEventListener("resize", onResize);
  addEventListener("orientationchange", onResize);

  // ---------- boot ----------
  build(pickMode(), 1);
  updateUI();
  const first = [1, 2, 3, 4].map(n => new Promise(res => {
    const im = new Image(); im.onload = im.onerror = res; im.src = src(n);
  }));
  Promise.race([Promise.all(first), new Promise(r => setTimeout(r, 4000))]).then(() => {
    $("loading").classList.add("done");
    if (saved > 2 && saved < PAGE_COUNT) {
      $("resumeText").textContent = `Continue from ${saved === FRIENDS_PAGE ? "The End" : "page " + (saved - 2)}?`;
      hint.classList.add("hide");
      resume.classList.remove("hide");
    } else {
      setTimeout(() => hint.classList.add("hide"), 6000);
    }
    // a little tease: lift the cover corner so readers know it turns
    if (!reduceMotion) setTimeout(() => {
      if (target !== 0 || anims.size || drag) return;
      lastDir = 1;
      animateLeaf(0, -22, 600);
      setTimeout(() => { if (target === 0 && !drag) animateLeaf(0, 0, 700); }, 650);
    }, 700);
    // warm the rest of the pages in the background
    for (let n = 5; n <= PAGE_COUNT; n++) { const im = new Image(); im.decoding = "async"; im.src = src(n); }
  });
})();
</script>
